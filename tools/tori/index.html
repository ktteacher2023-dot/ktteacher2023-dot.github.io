<meta name="twitter:description" content="声の高さで小鳥が上下に飛ぶ。輪っかをくぐって、音の高い・低いを体で覚える。低学年向けの、無料の音あそびツール。">

<style>
:root{--main:#4EA8DE;--ink:#2B2B33}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Zen Maru Gothic',sans-serif;background:#EAF4FF;color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  user-select:none;touch-action:manipulation}
header{padding:18px 20px 4px;text-align:center}
h1{font-size:clamp(24px,5vw,34px);font-weight:900;color:var(--main);letter-spacing:.06em}
.sub{font-size:13px;font-weight:700;color:#7a8a99;margin-top:2px}
#canvas{margin-top:8px;border-radius:24px;box-shadow:0 4px 0 rgba(0,0,0,.05)}
#scoreRow{display:flex;gap:20px;margin-top:10px;font-weight:900;font-size:16px}
#scoreRow b{color:var(--main);font-size:22px}
#msg{margin-top:6px;font-weight:900;font-size:clamp(15px,3.4vw,19px);color:var(--main);min-height:1.6em}
#controls{display:flex;gap:10px;margin:12px 0 24px;flex-wrap:wrap;justify-content:center}
.ctl{font-family:inherit;font-weight:900;font-size:15px;padding:12px 20px;border-radius:999px;
  border:3px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink)}
.ctl.on{background:var(--ink);color:#fff}
#micBtn{background:var(--main);border-color:var(--main);color:#fff}
</style>
</head>
<body>
<header>
  <h1>たかい? ひくい? とり</h1>
  <div class="sub">こえの たかさで ことりが とぶよ。わっかを くぐれるかな?</div>
</header>

<canvas id="canvas"></canvas>

<div id="scoreRow"><span>くぐった わっか <b id="score">0</b></span></div>
<div id="msg">🎤 マイクを おして、こえを だしてみよう</div>

<div id="controls">
  <button class="ctl" id="micBtn">🎤 マイクをつかう</button>
  <button class="ctl mode on" data-mode="free">のんびり</button>
  <button class="ctl mode" data-mode="rings">わっかくぐり</button>
</div>

<script>
(() => {
  const cv = document.getElementById('canvas'), ctx = cv.getContext('2d');
  const msg = document.getElementById('msg');
  let W, H;
  function resize(){
    W = Math.min(window.innerWidth*.92, 560);
    H = Math.min(window.innerHeight*.52, 400);
    cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resize(); window.addEventListener('resize', resize);

  // ---- mic & pitch (autocorrelation) ----
  let analyser = null, buf = null, sampleRate = 44100;
  document.getElementById('micBtn').addEventListener('click', async () => {
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
      const ac = new (window.AudioContext||window.webkitAudioContext)();
      sampleRate = ac.sampleRate;
      const src = ac.createMediaStreamSource(stream);
      analyser = ac.createAnalyser();
      analyser.fftSize = 2048;
      src.connect(analyser);
      buf = new Float32Array(analyser.fftSize);
      const b = document.getElementById('micBtn');
      b.textContent = '🎤 マイク オン'; b.disabled = true;
      msg.textContent = '「あーー」と こえを だすと ことりが とぶよ!';
    }catch(e){ msg.textContent = 'マイクが つかえないみたい。せんせいに きいてね。'; }
  });

  function detectPitch(){
    if(!analyser) return -1;
    analyser.getFloatTimeDomainData(buf);
    // RMS gate
    let rms = 0;
    for(let i = 0; i < buf.length; i++) rms += buf[i]*buf[i];
    rms = Math.sqrt(rms / buf.length);
    if(rms < 0.02) return -1;
    // autocorrelation
    const SIZE = buf.length;
    const minF = 100, maxF = 900;
    const minLag = Math.floor(sampleRate / maxF), maxLag = Math.floor(sampleRate / minF);
    let bestLag = -1, bestCorr = 0;
    for(let lag = minLag; lag <= maxLag; lag++){
      let corr = 0;
      for(let i = 0; i < SIZE - lag; i++) corr += buf[i] * buf[i+lag];
      if(corr > bestCorr){ bestCorr = corr; bestLag = lag; }
    }
    if(bestLag < 0) return -1;
    return sampleRate / bestLag;
  }

  // pitch → y (log scale, C3 130.8Hz bottom .. C6 1046Hz top, clamped)
  const FMIN = 130.8, FMAX = 900;
  function pitchToY(f){
    const t = (Math.log(f) - Math.log(FMIN)) / (Math.log(FMAX) - Math.log(FMIN));
    const tt = Math.min(Math.max(t, 0), 1);
    return H - 50 - tt * (H - 110);
  }

  // ---- bird ----
  let birdY = 0, targetY = 0, voiced = false, wing = 0;
  function drawBird(x, y, now){
    wing = Math.sin(now * (voiced ? .03 : .012)) * (voiced ? 1 : .5);
    ctx.save(); ctx.translate(x, y);
    // wing back
    ctx.fillStyle = '#FF9F1C';
    ctx.beginPath(); ctx.ellipse(-6, -2 - wing*6, 14, 8, -.5 - wing*.3, 0, 6.29); ctx.fill();
    // body
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 15, 0, 0, 6.29); ctx.fill();
    // belly
    ctx.fillStyle = '#FFF3C4';
    ctx.beginPath(); ctx.ellipse(3, 5, 12, 8, 0, 0, 6.29); ctx.fill();
    // eye
    ctx.fillStyle = '#2B2B33';
    ctx.beginPath(); ctx.arc(11, -5, 2.6, 0, 6.29); ctx.fill();
    // beak
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.moveTo(19, -4); ctx.lineTo(28, -1); ctx.lineTo(19, 2); ctx.fill();
    // tail
    ctx.fillStyle = '#FF9F1C';
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-30, -6 + wing*4); ctx.lineTo(-28, 4); ctx.fill();
    ctx.restore();
    // voice trail note
    if(voiced && Math.random() < .1){
      notes.push({x:x-26, y:y-8, vy:-.4, a:1});
    }
  }
  let notes = [];

  // ---- rings mode ----
  let mode = 'free', rings = [], score = 0, lastRing = 0;
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.mode').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.mode;
    rings = []; 
    msg.textContent = mode === 'rings' ? 'わっかの たかさに こえを あわせよう!' : 'すきな たかさで とんでみよう';
  }));

  function spawnRing(now){
    if(now - lastRing < 3200) return;
    lastRing = now;
    const y = 70 + Math.random() * (H - 160);
    rings.push({x: W + 30, y, r: 42, hit:false});
  }
  const birdX = () => W * .3;

  // ---- background ----
  let clouds = [];
  for(let i = 0; i < 4; i++) clouds.push({x:Math.random()*560, y:30+Math.random()*120, s:.5+Math.random()*.8});

  function loop(now){
    // pitch
    const f = detectPitch();
    if(f > 0){ voiced = true; targetY = pitchToY(f); }
    else { voiced = false; targetY = Math.min(targetY + 1.2, H - 60); }  // glide down
    birdY += (targetY - birdY) * .12;
    if(!birdY) birdY = H * .6;

    // draw
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#BFE3FF'); g.addColorStop(1, '#EAF6FF');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    clouds.forEach(c => {
      c.x -= .3 * c.s; if(c.x < -80) c.x = W + 80;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 18*c.s, 0, 6.29);
      ctx.arc(c.x+20*c.s, c.y+4, 14*c.s, 0, 6.29);
      ctx.arc(c.x-20*c.s, c.y+5, 13*c.s, 0, 6.29);
      ctx.fill();
    });
    // high/low labels
    ctx.fillStyle = 'rgba(78,168,222,.5)';
    ctx.font = "900 14px 'Zen Maru Gothic'";
    ctx.fillText('↑ たかい こえ', 12, 26);
    ctx.fillText('↓ ひくい こえ', 12, H - 14);

    // rings
    if(mode === 'rings' && analyser){
      spawnRing(now);
      rings.forEach(r => {
        r.x -= 1.6;
        ctx.lineWidth = 8;
        ctx.strokeStyle = r.hit ? '#7BE0AD' : '#FF9F1C';
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.29); ctx.stroke();
        if(!r.hit && Math.abs(r.x - birdX()) < 14 && Math.abs(r.y - birdY) < r.r - 12){
          r.hit = true; score++;
          document.getElementById('score').textContent = score;
          msg.textContent = ['やったー!','ナイス!','じょうず!','すごい!'][score % 4];
          for(let i = 0; i < 6; i++)
            notes.push({x:r.x, y:r.y, vy:-1 - Math.random(), a:1, star:true});
        }
      });
      rings = rings.filter(r => r.x > -60);
    }

    // notes / stars
    notes.forEach(n => { n.y += n.vy; n.a -= .015; });
    notes = notes.filter(n => n.a > 0);
    notes.forEach(n => {
      ctx.globalAlpha = n.a;
      ctx.font = "18px sans-serif";
      ctx.fillText(n.star ? '⭐' : '♪', n.x, n.y);
      ctx.globalAlpha = 1;
    });

    drawBird(birdX(), birdY, now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
