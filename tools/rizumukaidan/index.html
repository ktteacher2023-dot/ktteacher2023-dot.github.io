<html lang="ja">
<head>

<meta property="og:title" content="りずむかいだん｜けいてぃの音楽ツールズ">
<meta property="og:description" content="たん・うんから16分音符・両手打ちまで、階段をのぼるようにリズムめいじんに！MusicXMLで自作課題も。">

<meta property="og:type" content="website">

<style>
:root{
  --orange:#F08A3C; --orange-d:#D9742A;
  --blue:#4A90D9;  --blue-d:#3A78B8;
  --ink:#3A3532; --paper:#FDF9F2; --line:#4A443F;
  --green:#4CAF50; --gold:#F5B32F; --grass:#4A9D5A;
  --shadow:0 4px 14px rgba(80,60,30,.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Zen Maru Gothic','BIZ UDPGothic',sans-serif;
  background:var(--paper); color:var(--ink);
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}

/* ===== 🏠 ツール一覧ボタン（共通の型） ===== */
#ktHomeBtn{
  position:fixed; top:8px; left:8px; z-index:300;
  display:flex; align-items:center; gap:4px;
  background:#fff; border:2px solid #E8DFD2; border-radius:999px;
  padding:6px 12px; font-size:13px; font-weight:700; color:#7A6F60;
  box-shadow:0 2px 6px rgba(0,0,0,.08); text-decoration:none;
}
#ktHomeBtn:active{transform:scale(.96)}

/* ===== 画面切替 ===== */
.screen{display:none; flex:1; flex-direction:column; min-height:0}
.screen.active{display:flex}

/* ===== レベルせんたく ===== */
#scrSelect{overflow-y:auto; padding:56px 16px 90px; align-items:center}
#scrSelect h2{font-size:22px; font-weight:900; color:var(--orange-d); margin-bottom:4px; text-align:center}
#scrSelect .hint{font-size:13px; color:#8A7A62; margin-bottom:14px; text-align:center}
#stairs{display:flex; flex-direction:column; gap:10px; width:min(560px,100%)}
.lvCard{
  display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px;
  border:2px solid #EFE4D2; box-shadow:var(--shadow); padding:12px 16px; text-align:left; width:100%;
}
.lvCard:active{transform:scale(.98)}
.lvCard .num{
  flex:none; width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:900; color:#fff; background:var(--orange);
}
.lvCard.hands2 .num{background:var(--blue)}
.lvCard.customCard .num{background:var(--grass); font-size:26px}
.lvCard .info{flex:1; min-width:0}
.lvCard .name{font-size:17px; font-weight:900}
.lvCard .desc{font-size:12px; color:#8A7A62}
.lvCard .stars{font-size:13px; color:var(--gold); letter-spacing:1px}
.lvCard .seal{flex:none; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:26px; border:2px dashed #E0CFAF; background:#FFFBF2}
.lvCard .seal.got{border-style:solid; border-color:var(--gold); background:#FFF3D0; box-shadow:0 0 10px rgba(245,179,47,.5)}
.lvCard .best{font-size:12px; color:#B99}
.lvCard.hands2{border-color:#D6E6F5}
.lvCard.customCard{border-color:#CBE5D0}

/* ===== プレイ画面 ===== */
#scrPlay{background:#FDF9F2}
#playHead{
  display:flex; align-items:center; gap:8px; padding:8px 10px 4px 118px; flex-wrap:wrap;
}
#lvLabel{font-size:15px; font-weight:900; color:var(--orange-d); max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#exTabs{display:flex; gap:6px}
.exTab{font-size:13px; font-weight:700; padding:4px 12px; border-radius:999px; background:#F1E7D6; color:#8A7A62}
.exTab.on{background:var(--orange); color:#fff}
#playHead .spacer{flex:1}
.iconBtn{width:38px; height:38px; border-radius:10px; background:#fff; border:2px solid #EFE4D2;
  font-size:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.07)}
.iconBtn:active{transform:scale(.94)}

#scoreWrap{position:relative; margin:2px 10px; background:#fff; border:2px solid #F0E6D4; border-radius:16px;
  box-shadow:var(--shadow); padding:4px 6px; flex:none}
#scoreSvg{display:block; width:100%; height:auto}
#countOverlay{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  font-size:min(20vw,110px); font-weight:900; color:var(--orange); text-shadow:0 3px 0 #fff;
  pointer-events:none; z-index:5;
}
#msgOverlay{
  position:absolute; left:0; right:0; top:4px; text-align:center; font-size:14px; font-weight:700;
  color:#9A8B72; pointer-events:none;
}
#comboBadge{
  position:absolute; right:10px; top:6px; font-size:16px; font-weight:900; color:var(--orange-d);
  background:#FFF3D9; border-radius:999px; padding:3px 12px; display:none;
}

#ctrlRow{display:flex; align-items:center; justify-content:center; gap:10px; padding:6px 10px; flex-wrap:wrap}
.ctlBtn{
  font-size:16px; font-weight:900; padding:10px 20px; border-radius:999px; color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.15); display:flex; align-items:center; gap:6px;
}
.ctlBtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15)}
#btnListen{background:linear-gradient(180deg,#67B96F,var(--grass))}
#btnStart{background:linear-gradient(180deg,#F49B4E,var(--orange-d)); font-size:19px; padding:12px 34px}
#btnStart.stop{background:linear-gradient(180deg,#999,#777)}
#modeToggle{display:flex; background:#EFE4D2; border-radius:999px; padding:3px}
#modeToggle button{font-size:13px; font-weight:900; padding:7px 14px; border-radius:999px; color:#8A7A62}
#modeToggle button.on{background:#fff; color:var(--orange-d); box-shadow:0 1px 4px rgba(0,0,0,.12)}
#wordToggle{font-size:12px; font-weight:700; color:#8A7A62; background:#fff; border:2px solid #EFE4D2;
  border-radius:999px; padding:7px 12px}
#wordToggle.on{background:#FFF3D9; color:var(--orange-d); border-color:#F5CFA0}

/* ===== パッド ===== */
#padArea{flex:1; display:flex; gap:10px; padding:4px 10px 12px; min-height:110px}
.pad{
  flex:1; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; font-weight:900; color:#fff; position:relative; overflow:hidden;
  touch-action:none; box-shadow:inset 0 -8px 0 rgba(0,0,0,.14), var(--shadow);
}
.pad .big{font-size:clamp(22px,5.5vw,34px); letter-spacing:.08em; text-shadow:0 2px 3px rgba(0,0,0,.18)}
.pad .small{font-size:clamp(12px,2.6vw,15px); opacity:.92}
#padR{background:linear-gradient(180deg,#F6A055,var(--orange))}
#padL{background:linear-gradient(180deg,#6CA9E4,var(--blue)); display:none}
.pad.flash{filter:brightness(1.35)}
.pad .ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,.45); transform:translate(-50%,-50%);
  animation:rip .45s ease-out forwards; pointer-events:none}
@keyframes rip{from{width:0;height:0;opacity:.9}to{width:260px;height:260px;opacity:0}}
body.two-hands #padL{display:flex}

/* ===== けっか・かたてりょうて えらび ===== */
.overlay{
  position:fixed; inset:0; background:rgba(60,45,25,.45); display:none; align-items:center; justify-content:center; z-index:400; padding:16px;
}
.card{
  background:#fff; border-radius:24px; padding:26px 24px; width:min(420px,100%); text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.3); animation:pop .35s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h3{font-size:22px; font-weight:900; color:var(--orange-d); margin-bottom:6px}
#resStars{font-size:44px; letter-spacing:6px; margin:4px 0; min-height:56px}
#resStars .off{opacity:.18}
#resDetail{font-size:14px; color:#8A7A62; margin-bottom:8px}
#resSeal{font-size:15px; font-weight:900; color:var(--grass); min-height:24px; margin-bottom:10px}
.card .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.card .row button{font-size:15px; font-weight:900; padding:11px 18px; border-radius:999px; color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.15)}
#btnRetry{background:var(--orange)}
#btnNextEx{background:var(--grass)}
#btnBackSel{background:#9A8B72}
#handsCard p{font-size:14px; color:#8A7A62; margin-bottom:14px}
#btnHands1{background:var(--orange)}
#btnHands2{background:var(--blue)}
#handsCancel{background:#BBB}

/* ===== 設定パネル ===== */
#settingsPanel{
  position:fixed; top:0; right:-320px; width:300px; max-width:88vw; height:100%; background:#fff; z-index:350;
  box-shadow:-6px 0 24px rgba(0,0,0,.18); transition:right .25s ease; padding:56px 20px 20px; overflow-y:auto;
}
#settingsPanel.open{right:0}
#settingsPanel h3{font-size:17px; font-weight:900; color:var(--orange-d); margin-bottom:14px}
.setRow{margin-bottom:18px}
.setRow label{display:block; font-size:13px; font-weight:700; color:#8A7A62; margin-bottom:6px}
.setRow input[type=range]{width:100%}
.setRow .val{font-weight:900; color:var(--ink)}
#btnCloseSet{position:absolute; top:12px; right:12px; font-size:22px; color:#AAA}

/* ===== フッター ===== */
footer{
  flex:none; text-align:center; font-size:11px; color:#A8987F; padding:4px 8px 6px; line-height:1.6;
}
footer a{color:#C08A45; text-decoration:none; font-weight:700}
#scrPlay footer{display:none}

/* ===== パーティクル ===== */
.confetti{position:fixed; width:10px; height:10px; border-radius:3px; z-index:500; pointer-events:none;
  animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.2}}

@media (max-height:560px){
  #padArea{min-height:80px}
}
</style>
</head>
<body>

<!-- 🏠 ツール一覧（共通の型） -->
<a id="ktHomeBtn" href="https://ktteacher.net/tools/">🏠 <span>ツール一覧</span></a>

<!-- ===== ② レベルせんたく ===== -->
<section id="scrSelect" class="screen active">
  <h2>レベルを えらぼう</h2>
  <p class="hint">クリアすると シールが もらえるよ！　したの だんから のぼっていこう<br>🔊 おとが でるよ（おんりょうに きをつけてね）</p>
  <div id="stairs"></div>
  <input type="file" id="xmlInput" accept=".xml,.musicxml,.mxl" style="display:none">
</section>

<!-- ===== ③ プレイ ===== -->
<section id="scrPlay" class="screen">
  <div id="playHead">
    <button class="iconBtn" id="btnBackTop" title="レベルせんたくへ">↩</button>
    <span id="lvLabel">Lv1</span>
    <div id="exTabs"></div>
    <span class="spacer"></span>
    <button class="iconBtn" id="btnFull" title="ぜんがめん">⛶</button>
    <button class="iconBtn" id="btnGear" title="せってい">⚙️</button>
  </div>

  <div id="scoreWrap">
    <svg id="scoreSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="countOverlay"></div>
    <div id="msgOverlay"></div>
    <div id="comboBadge">🔥 0</div>
  </div>

  <div id="ctrlRow">
    <div id="modeToggle">
      <button id="modePractice" class="on">れんしゅう</button>
      <button id="modeChallenge">チャレンジ</button>
    </div>
    <button class="ctlBtn" id="btnListen">👂 きいてみる</button>
    <button class="ctlBtn" id="btnStart">▶ スタート</button>
    <button id="wordToggle">ことばを みる</button>
  </div>

  <div id="padArea">
    <div class="pad" id="padL">
      <span class="big">ひだりて</span>
      <span class="small">はくを きざむ</span>
    </div>
    <div class="pad" id="padR">
      <span class="big">たたく</span>
      <span class="small">リズムを たたこう</span>
    </div>
  </div>
</section>

<!-- けっか -->
<div id="resultOverlay" class="overlay">
  <div class="card">
    <h3 id="resTitle">できた！</h3>
    <div id="resStars"></div>
    <p id="resDetail"></p>
    <p id="resSeal"></p>
    <div class="row">
      <button id="btnRetry">もういちど</button>
      <button id="btnNextEx">つぎへ ▶</button>
      <button id="btnBackSel">レベルせんたく</button>
    </div>
  </div>
</div>

<!-- かたて／りょうて えらび（MusicXML用） -->
<div id="handsOverlay" class="overlay">
  <div class="card" id="handsCard">
    <h3 id="handsTitle">🎼 きょくを よみこんだよ！</h3>
    <p id="handsInfo"></p>
    <div class="row">
      <button id="btnHands1" class="ctl">かたてで たたく</button>
      <button id="btnHands2" class="ctl">りょうてで たたく</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="handsCancel">やめる</button>
    </div>
  </div>
</div>

<!-- せってい -->
<div id="settingsPanel">
  <button id="btnCloseSet">✕</button>
  <h3>⚙️ せんせいの せってい</h3>
  <div class="setRow">
    <label>はやさ（テンポ）：<span class="val" id="tempoVal">80</span></label>
    <input type="range" id="tempoRange" min="52" max="144" step="4" value="80">
  </div>
  <div class="setRow">
    <label>おんりょう：<span class="val" id="volVal">70</span>%</label>
    <input type="range" id="volRange" min="0" max="100" step="5" value="70">
  </div>
  <div class="setRow">
    <label>タイミングちょうせい：<span class="val" id="latVal">0</span> ms<br>
    <small>（音より判定が早い/遅いと感じたら調整）</small></label>
    <input type="range" id="latRange" min="-150" max="150" step="10" value="0">
  </div>
  <div class="setRow">
    <label>キーボードでも あそべます：<b>F</b>＝ひだりて／<b>J</b>＝みぎて</label>
  </div>
  <div class="setRow">
    <label>🎼 MusicXMLよみこみ：Flat for Education などで作った楽譜（.xml / .musicxml / .mxl）を
    「じぶんの きょく」から読み込むと、そのリズムで練習できます（音の高さは使わず、リズムだけ取り出します）。</label>
  </div>
</div>

<footer>
  🔒 音も楽譜ファイルもこの端末の中だけで処理しています。録音・送信はしません。<br>
  <a href="https://ktteacher.net/tools/">けいてぃの音楽ツールズ</a>　© けいてぃの音楽ツールズ
</footer>

<script>
"use strict";
/* =====================================================================
   りずむかいだん（フル）— 単線リズム→16分・3拍子・シンコペ・両手打ち
   ＋ MusicXML読み込み（Flat for Education 連携）
   哲学：①あそぶ（パッドは いつでも鳴る）→ ②きづく（カーソル・○・きいてみる）
        → ③なまえ（「ことばを みる」で たん・たた・たかたか・うん を後出し）
   時間の基準はすべて「16分音符（unit）」。1拍 = 4unit。
   ===================================================================== */

/* ---------- トークン定義（単位：16分） ----------
   単音: 1(全=16) 2.(12) 2(8) 4.(6) 4(4) 8.(3) 8(2) 16(1)
   休符: 1r 2r 4r 8r
   連桁グループ: 88(♪♪) 1111(タカタカ) 811(タンタカ) 118(タカタン) 8.16(タッカ) */
const SINGLE = {"1":16,"2.":12,"2":8,"4.":6,"4":4,"8.":3,"8":2,"16":1,
                "1r":16,"2r":8,"4r":4,"8r":2};
const GROUPS = {
  "88":   {durs:[2,2],     words:["た","た"]},
  "1111": {durs:[1,1,1,1], words:["た","か","た","か"]},
  "811":  {durs:[2,1,1],   words:["たん","た","か"]},
  "118":  {durs:[1,1,2],   words:["た","か","たん"]},
  "8.16": {durs:[3,1],     words:["たっ","か"]}
};
const NOTE_WORD = {16:"たーあーあーあー",12:"たーあーあー",8:"たーあー",6:"たーん",4:"たん",3:"たっ",2:"た",1:"か"};
const REST_WORD = {16:"（うん×4）",12:"（うん×3）",8:"（うんうん）",6:"うんん",4:"うん",3:"ん",2:"ん",1:"ん"};

/* ---------- レベルデータ（beats: 1小節の拍数） ---------- */
const LEVELS = [
  {id:1, name:"たん と うん", desc:"しぶおんぷ・しぶきゅうふ", stars:1, hands:1, beats:4, seal:"🐣", ex:[
    ["4 4 4 4","4 4 4 4r","4 4r 4 4r","4 4 4 4"],
    ["4 4r 4 4","4r 4 4 4r","4 4 4r 4","4 4r 4 4r"]
  ]},
  {id:2, name:"のばす おと", desc:"2ぶおんぷ・ぜんおんぷ", stars:1, hands:1, beats:4, seal:"🐰", ex:[
    ["2 4 4","4 4 2","2 2","1"],
    ["4 4 2","2 4 4r","2. 4","1"]
  ]},
  {id:3, name:"たた とうじょう", desc:"8ぶおんぷの ペア", stars:2, hands:1, beats:4, seal:"🐱", ex:[
    ["4 88 4 4","88 88 4 4r","4 88 88 4","2 4 4r"],
    ["88 4 88 4","4 4 88 88","88 88 88 4","1"]
  ]},
  {id:4, name:"やすみも リズム", desc:"8ぶきゅうふ", stars:2, hands:1, beats:4, seal:"🦊", ex:[
    ["4 88 8r 8 4","88 4 8r 8 4","4 8r 8 4 4r","2 8r 8 4"],
    ["8r 8 4 8r 8 4","4 88 4 8r 8","8r 8 8r 8 2","4 4 2"]
  ]},
  {id:5, name:"ぴょんの リズム", desc:"ふてん4ぶ＋8ぶ", stars:2, hands:1, beats:4, seal:"🐼", ex:[
    ["4. 8 4 4","4 4 4. 8","4. 8 88 4","2 4 4r"],
    ["4. 8 4. 8","88 4 4. 8","4. 8 4 88","1"]
  ]},
  {id:6, name:"りょうて デビュー", desc:"ひだりて＝はく が くわわる！", stars:3, hands:2, beats:4, seal:"🦁", ex:[
    ["4 4 4 4","2 4 4","4 4r 4 4r","2 2"],
    ["4 4 2","4 4r 2","2 4 4","1"]
  ]},
  {id:7, name:"りょうて で たた", desc:"みぎてに 8ぶおんぷ", stars:3, hands:2, beats:4, seal:"🐘", ex:[
    ["4 88 4 4","88 88 4 4","4 4 88 4","2 4 4r"],
    ["88 4 88 4","4 88 4 4r","88 88 4 88","1"]
  ]},
  {id:8, name:"りょうて マスター", desc:"やすみ・ふてん ぜんぶ まぜて！", stars:4, hands:2, beats:4, seal:"🐉", ex:[
    ["4. 8 4 4r","88 4 8r 8 4","4 88 4. 8","2 4 4r"],
    ["8r 8 88 4 4","4. 8 88 88","4 8r 8 4 88","1"]
  ]},
  {id:9, name:"たかたか 16ぶ", desc:"16ぶおんぷ・タッカ", stars:4, hands:1, beats:4, seal:"🐿️", ex:[
    ["4 1111 4 4","1111 88 4 4","4 811 118 4","2 4 4r"],
    ["1111 4 1111 4","4 8.16 4 4","811 811 88 4","1"]
  ]},
  {id:10, name:"3びょうしの くに", desc:"1・2・3で ワルツ（りょうて）", stars:3, hands:2, beats:3, seal:"🐨", ex:[
    ["4 4 4","2 4","4 4 4r","2."],
    ["4 88 4","2 4","88 88 4","2."]
  ]},
  {id:11, name:"シンコペーション", desc:"うらが はねる リズム（りょうて）", stars:4, hands:2, beats:4, seal:"🐙", ex:[
    ["8 4 8 4 4","8 4 8 8 4 8","4 88 8 4 8","2 4 4r"],
    ["4r 8 4 8 4","8 4 8 8r 8 4","8 4 4 4 8","1"]
  ]}
];

/* ---------- 状態 ---------- */
const S = {
  lv:null, exIdx:0, mode:"practice",      // practice | challenge
  phase:"idle",                            // idle | count | play | listen
  showWords:false,
  tempo:80, vol:0.7, latency:0,
  ac:null, master:null, sched:null,
  startAt:0, countDur:0, totalDur:0, unit:0, // unit = 16分音符の秒数
  events:{R:[],L:[]}, measures:0, upm:16, beats:4,
  raf:0, timers:[],
  combo:0, maxCombo:0, hitGood:0, hitOk:0, strays:0,
  progress:{}, custom:null                 // custom: MusicXMLから作った課題
};

/* ---------- 保存（失敗しても動く） ---------- */
const KEY="rizumu_kaidan_v1";
function loadProg(){ try{ S.progress = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ S.progress={}; } }
function saveProg(){ try{ localStorage.setItem(KEY, JSON.stringify(S.progress)); }catch(e){} }

/* ---------- Audio ---------- */
function ensureAudio(){
  if(!S.ac){
    S.ac = new (window.AudioContext||window.webkitAudioContext)();
    S.master = S.ac.createGain(); S.master.gain.value = S.vol;
    S.master.connect(S.ac.destination);
  }
  if(S.ac.state==="suspended") S.ac.resume();
}
function env(g,t,peak,dur){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
function clickSound(t,accent){ // メトロノーム（予約音はschedへ）
  const o=S.ac.createOscillator(), g=S.ac.createGain();
  o.type="square"; o.frequency.value = accent?1568:1175;
  env(g,t,accent?0.22:0.13,0.05); o.connect(g); g.connect(S.sched||S.master); o.start(t); o.stop(t+0.08);
}
function tapR(t,dest){ // みぎて：ウッドブロック風
  dest=dest||S.master;
  const o=S.ac.createOscillator(), g=S.ac.createGain();
  o.type="triangle"; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(620,t+0.06);
  env(g,t,0.5,0.10); o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.14);
  const n=S.ac.createOscillator(), ng=S.ac.createGain();
  n.type="square"; n.frequency.value=2200; env(ng,t,0.12,0.03);
  n.connect(ng); ng.connect(dest); n.start(t); n.stop(t+0.05);
}
function tapL(t,dest){ // ひだりて：ひくい たいこ風
  dest=dest||S.master;
  const o=S.ac.createOscillator(), g=S.ac.createGain();
  o.type="sine"; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(90,t+0.12);
  env(g,t,0.7,0.18); o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.22);
}
function fanfare(){
  ensureAudio(); const base=S.ac.currentTime+0.05;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const o=S.ac.createOscillator(), g=S.ac.createGain();
    o.type="triangle"; o.frequency.value=f; const t=base+i*0.12;
    env(g,t,0.3,0.35); o.connect(g); g.connect(S.master); o.start(t); o.stop(t+0.4);
  });
}

/* ---------- 音価 → 見た目の属性 ---------- */
function decorate(ev){
  ev.open = !ev.rest && ev.dur16>=8;
  ev.dot  = (ev.dur16===12||ev.dur16===6||ev.dur16===3);
  ev.flags = (!ev.rest && !ev.beamId) ? (ev.dur16===1?2:(ev.dur16===2||ev.dur16===3)?1:0) : 0;
  return ev;
}

/* ---------- トークン楽譜パース ---------- */
function parseExercise(measures, upm){
  const ev=[]; let pos=0, beamSeq=0;
  measures.forEach((m,mi)=>{
    let mpos=0;
    m.trim().split(/\s+/).forEach(tok=>{
      if(GROUPS[tok]){
        const g=GROUPS[tok], b=++beamSeq;
        g.durs.forEach((d,i)=>{
          ev.push(decorate({t16:pos+mpos, dur16:d, rest:false, beamId:b, m:mi, word:g.words[i]}));
          mpos+=d;
        });
      }else{
        const d=SINGLE[tok];
        const rest=tok.endsWith("r");
        ev.push(decorate({t16:pos+mpos, dur16:d, rest, m:mi,
          word: rest?REST_WORD[d]:NOTE_WORD[d]}));
        mpos+=d;
      }
    });
    if(mpos!==upm) console.warn("小節の長さがちがう:",mi,m,mpos);
    pos+=upm;
  });
  return {events:ev, measures:measures.length, upm};
}

/* ---------- MusicXML → 課題化 ---------- */
const Q16 = [1,2,3,4,6,8,12,16]; // 量子化候補
function quantize(u){ let best=Q16[0],bd=1e9; Q16.forEach(q=>{const d=Math.abs(u-q); if(d<bd){bd=d;best=q;}}); return best; }

async function readMusicXMLFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".mxl")){
    // 圧縮MusicXML：JSZipをCDNから遅延読み込み
    if(!window.JSZip){
      await new Promise((ok,ng)=>{
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
        s.onload=ok; s.onerror=()=>ng(new Error("mxl_offline"));
        document.head.appendChild(s);
      }).catch(()=>{ throw new Error("『.mxl』はインターネットにつながっているときだけ読めます。Flatから『.musicxml（非圧縮）』で書き出してください。"); });
    }
    const zip=await window.JSZip.loadAsync(file);
    let rootPath=null;
    const container=zip.file("META-INF/container.xml");
    if(container){
      const cx=new DOMParser().parseFromString(await container.async("string"),"application/xml");
      const rf=cx.querySelector("rootfile");
      if(rf) rootPath=rf.getAttribute("full-path");
    }
    if(!rootPath){
      rootPath=Object.keys(zip.files).find(p=>!p.startsWith("META-INF")&&/\.(xml|musicxml)$/i.test(p));
    }
    if(!rootPath) throw new Error("楽譜データが見つかりませんでした。");
    return await zip.file(rootPath).async("string");
  }
  return await file.text();
}

function parseMusicXML(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("楽譜ファイルとして読みこめませんでした。");
  const part=doc.querySelector("part");
  if(!part) throw new Error("パート（楽器）が見つかりませんでした。");

  // 拍子（最初の <time>）
  let beats=4;
  const timeEl=doc.querySelector("time");
  if(timeEl){
    const b=parseInt(timeEl.querySelector("beats")?.textContent||"4",10);
    const bt=parseInt(timeEl.querySelector("beat-type")?.textContent||"4",10);
    if(bt!==4 || b<2 || b>4)
      throw new Error("いまは 2/4・3/4・4/4 びょうしの きょくだけ よみこめます。");
    beats=b;
  }
  const upm=beats*4;

  // テンポ（あれば採用）
  let fileTempo=null;
  const snd=doc.querySelector("sound[tempo]");
  if(snd) fileTempo=Math.round(parseFloat(snd.getAttribute("tempo")));
  const pm=doc.querySelector("per-minute");
  if(!fileTempo && pm) fileTempo=Math.round(parseFloat(pm.textContent));

  let divisions=1;
  const events=[]; let mCount=0; const MAXM=8; let truncated=false;
  const measures=part.querySelectorAll(":scope > measure");
  for(const meas of measures){
    if(mCount>=MAXM){ truncated=true; break; }
    const dEl=meas.querySelector("attributes > divisions");
    if(dEl) divisions=parseInt(dEl.textContent,10)||divisions;
    let mpos=0;
    for(const node of meas.children){
      if(node.tagName==="backup"||node.tagName==="forward"){
        // 複数声部は第1声部のみ対象：backup以降は読まない
        if(node.tagName==="backup") break;
        const fd=parseInt(node.querySelector("duration")?.textContent||"0",10);
        mpos+=Math.round(fd/divisions*4); continue;
      }
      if(node.tagName!=="note") continue;
      if(node.querySelector("grace")) continue;
      const durEl=node.querySelector("duration");
      if(!durEl) continue;
      const raw=Math.round(parseInt(durEl.textContent,10)/divisions*4);
      if(raw<=0) continue;
      const isChord=!!node.querySelector("chord");
      const isRest=!!node.querySelector("rest");
      const tieStop=!!node.querySelector('tie[type="stop"]');
      if(isChord) continue;               // 和音は最初の音だけ
      if(mpos>=upm) continue;             // 小節あふれは無視
      const dur=Math.min(quantize(raw), upm-mpos);
      const tied = tieStop && !isRest && events.length && !events[events.length-1].rest;
      events.push({t16:mCount*upm+mpos, dur16:dur, rest:isRest, tied, m:mCount});
      mpos+=dur;
    }
    // アウフタクト（弱起）や足りない小節は休符でうめる
    if(mpos<upm){
      if(mCount===0 && events.filter(e=>e.m===0).length){
        const shift=upm-mpos;
        events.forEach(e=>{ if(e.m===0) e.t16+=shift; });
        events.unshift({t16:0, dur16:quantize(shift), rest:true, m:0});
      }else{
        events.push({t16:mCount*upm+mpos, dur16:quantize(upm-mpos), rest:true, m:mCount});
      }
    }
    mCount++;
  }
  if(!events.some(e=>!e.rest)) throw new Error("音符が見つかりませんでした。");


  // 自動連桁：同じ拍の中の みじかい音（16分・8分・付点8分）をつなぐ
  let beamSeq=1000, i=0;
  while(i<events.length){
    const e=events[i];
    const beat=Math.floor(e.t16/4);
    if(!e.rest && e.dur16<4){
      let j=i;
      while(j+1<events.length && !events[j+1].rest && events[j+1].dur16<4 &&
            Math.floor(events[j+1].t16/4)===beat) j++;
      if(j>i){ const b=++beamSeq; for(let k=i;k<=j;k++) events[k].beamId=b; }
      i=j+1;
    }else i++;
  }
  events.forEach(e=>{ decorate(e);
    e.word = e.tied?"ー": e.rest?(REST_WORD[e.dur16]||"うん"):(NOTE_WORD[e.dur16]||"たん"); });

  // 曲名
  const title=doc.querySelector("work-title, movement-title")?.textContent?.trim()||"";
  return {events, measures:mCount, upm, beats, fileTempo, title, truncated};
}

/* ---------- 楽譜描画（単線・SVG） ---------- */
const SVGNS="http://www.w3.org/2000/svg";
function el(name,attrs,parent){
  const e=document.createElementNS(SVGNS,name);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
const LAYOUT={W:1000, left:78, right:26, lineY1:78, lineY2:196, H1:150, H2:262};

function xForUnit(t16, measures, upm){
  const mW=(LAYOUT.W-LAYOUT.left-LAYOUT.right)/measures;
  const mi=Math.min(Math.floor(t16/upm), measures-1);
  const inM=t16-mi*upm;
  return LAYOUT.left + mi*mW + 14 + (inM/upm)*(mW-26);
}

function drawRest(g,dur16,x,y){
  const dot = (dur16===12||dur16===6||dur16===3);
  const base = dur16>=16?16 : dur16>=8?8 : dur16>=4?4 : dur16>=2?2 : 1;
  if(base===4){ // 4分休符（ジグザグ）
    el("path",{d:`M ${x-2} ${y-15} L ${x+5} ${y-6} L ${x-2} ${y+1} L ${x+5} ${y+9} Q ${x-2} ${y+5} ${x} ${y+13}`,
      fill:"none",stroke:"var(--line)","stroke-width":3.4,"stroke-linecap":"round","stroke-linejoin":"round"},g);
  }else if(base===2||base===1){ // 8分・16分休符
    el("circle",{cx:x-3,cy:y-8,r:3,fill:"var(--line)"},g);
    if(base===1) el("circle",{cx:x-1,cy:y-1,r:3,fill:"var(--line)"},g);
    el("path",{d:`M ${x-3} ${y-8} Q ${x+2} ${y-5} ${x+5} ${y-11} L ${x-1} ${y+10}`,
      fill:"none",stroke:"var(--line)","stroke-width":2.6,"stroke-linecap":"round"},g);
  }else if(base===8){ // 2分休符（線の上にのる）
    el("rect",{x:x-8,y:y-7,width:17,height:7,rx:1,fill:"var(--line)"},g);
    el("line",{x1:x-12,y1:y,x2:x+13,y2:y,stroke:"var(--line)","stroke-width":2},g);
  }else{ // 全休符（線の下にぶらさがる）
    el("rect",{x:x-8,y:y,width:17,height:7,rx:1,fill:"var(--line)"},g);
    el("line",{x1:x-12,y1:y,x2:x+13,y2:y,stroke:"var(--line)","stroke-width":2},g);
  }
  if(dot) el("circle",{cx:x+13,cy:y-4,r:3,fill:"var(--line)"},g);
}

function drawNote(g,ev,x,y){
  el("ellipse",{cx:x,cy:y,rx:9.5,ry:7,transform:`rotate(-18 ${x} ${y})`,
    fill:ev.open?"none":"var(--line)",stroke:"var(--line)","stroke-width":2.6},g);
  if(ev.dot) el("circle",{cx:x+15,cy:y-4,r:3,fill:"var(--line)"},g);
  let stemTop=null;
  if(ev.dur16<16){ // 全音符いがいは符尾（上向き）
    const sx=x+8.4, sy1=y-2.5, sy2=y-46;
    el("line",{x1:sx,y1:sy1,x2:sx,y2:sy2,stroke:"var(--line)","stroke-width":2.4,"stroke-linecap":"round"},g);
    stemTop={x:sx,y:sy2};
    for(let f=0; f<ev.flags; f++){ // 単独の はた（8分=1枚・16分=2枚）
      const fy=sy2+f*9;
      el("path",{d:`M ${sx} ${fy} C ${sx+11} ${fy+6} ${sx+12} ${fy+16} ${sx+4} ${fy+26}`,
        fill:"none",stroke:"var(--line)","stroke-width":3,"stroke-linecap":"round"},g);
    }
  }
  return stemTop;
}

function drawBeams(g,group){ // group: [{ev,stem}]（x昇順）
  const a=group[0].stem, b=group[group.length-1].stem;
  el("line",{x1:a.x-1,y1:a.y+2,x2:b.x+1,y2:b.y+2,stroke:"var(--line)","stroke-width":6},g); // 1本目
  // 2本目（16分のところだけ）
  let run=[];
  const flush=()=>{
    if(!run.length) return;
    const y=a.y+11;
    if(run.length>=2){
      el("line",{x1:run[0].stem.x-1,y1:y,x2:run[run.length-1].stem.x+1,y2:y,
        stroke:"var(--line)","stroke-width":5},g);
    }else{
      const s=run[0], idx=group.indexOf(s);
      const dir = idx===0 ? 1 : -1; // となりの音のほうへ みじかく
      el("line",{x1:s.stem.x,y1:y,x2:s.stem.x+dir*12,y2:y,stroke:"var(--line)","stroke-width":5},g);
    }
    run=[];
  };
  group.forEach(m=>{ if(m.ev.dur16===1) run.push(m); else flush(); });
  flush();
}

/* hand: "R"（リズム）or "L"（はく） */
function drawLine(svg, parsed, y, hand, accentColor, beats){
  const g=el("g",{},svg);
  const startX=LAYOUT.left-14, endX=LAYOUT.W-LAYOUT.right+8;
  el("line",{x1:startX-30,y1:y,x2:endX,y2:y,stroke:"var(--line)","stroke-width":2.2},g);
  // 拍子記号
  el("text",{x:startX-24,y:y-3,"font-size":26,"font-weight":900,"font-family":"Georgia,serif",fill:"var(--line)"},g).textContent=String(beats);
  el("text",{x:startX-24,y:y+21,"font-size":26,"font-weight":900,"font-family":"Georgia,serif",fill:"var(--line)"},g).textContent="4";
  // 小節線
  const mW=(LAYOUT.W-LAYOUT.left-LAYOUT.right)/parsed.measures;
  for(let i=1;i<parsed.measures;i++){
    const bx=LAYOUT.left+i*mW;
    el("line",{x1:bx,y1:y-22,x2:bx,y2:y+22,stroke:"var(--line)","stroke-width":2},g);
  }
  el("line",{x1:endX-7,y1:y-22,x2:endX-7,y2:y+22,stroke:"var(--line)","stroke-width":2},g);
  el("line",{x1:endX-1,y1:y-22,x2:endX-1,y2:y+22,stroke:"var(--line)","stroke-width":5},g);
  if(document.body.classList.contains("two-hands")){
    el("text",{x:8,y:y+5,"font-size":15,"font-weight":700,fill:accentColor},g)
      .textContent = hand==="R"?"みぎて":"ひだりて";
  }
  // 音符・休符
  const beams={};
  parsed.events.forEach(ev=>{
    ev.x = xForUnit(ev.t16, parsed.measures, parsed.upm);
    const noteG=el("g",{class:"noteG"},g);
    ev.node=noteG; ev.y=y;
    if(ev.rest) drawRest(noteG,ev.dur16,ev.x,y);
    else{
      const st=drawNote(noteG,ev,ev.x,y);
      if(ev.beamId && st){ (beams[ev.beamId]=beams[ev.beamId]||[]).push({ev,stem:st}); }
    }
    const w=el("text",{x:ev.x,y:y+42,"font-size":15,"font-weight":700,"text-anchor":"middle",
      fill:ev.rest?"#B9A98F":accentColor,class:"wordLbl"},noteG);
    w.textContent=ev.word||"";
    w.style.display=S.showWords?"":"none";
  });
  for(const id in beams){ if(beams[id].length>=2) drawBeams(g,beams[id]); }
  // タイ弧（前の音 → tiedの音）
  parsed.events.forEach((ev,i)=>{
    if(ev.tied && i>0){
      const px=parsed.events[i-1].x;
      el("path",{d:`M ${px+7} ${y+11} Q ${(px+ev.x)/2} ${y+22} ${ev.x-7} ${y+11}`,
        fill:"none",stroke:"var(--line)","stroke-width":2.4,"stroke-linecap":"round"},g);
    }
  });
  return g;
}

/* イベントの実行時コピー（判定フラグ・ノード参照をリセット） */
function cloneEvents(list){ return list.map(e=>Object.assign({},e,{hit:false,missed:false,node:null})); }

let cursorEls=[];
function buildScore(){
  const svg=document.getElementById("scoreSvg");
  svg.innerHTML=""; cursorEls=[];
  const lv=S.lv, two=lv.hands===2;
  document.body.classList.toggle("two-hands",two);
  svg.setAttribute("viewBox",`0 0 ${LAYOUT.W} ${two?LAYOUT.H2:LAYOUT.H1}`);

  let parsedR;
  if(lv.custom){
    parsedR={events:cloneEvents(lv.data.events), measures:lv.data.measures, upm:lv.data.upm};
  }else{
    parsedR=parseExercise(lv.ex[S.exIdx], lv.beats*4);
  }
  S.events.R=parsedR.events;
  S.measures=parsedR.measures; S.upm=parsedR.upm; S.beats=lv.beats;
  drawLine(svg,parsedR,two?LAYOUT.lineY1:LAYOUT.lineY1+8,"R","var(--orange-d)",lv.beats);

  if(two){
    const beat=[]; const beatStr=Array(lv.beats).fill("4").join(" ");
    for(let i=0;i<parsedR.measures;i++) beat.push(beatStr);
    const parsedL=parseExercise(beat, lv.beats*4);
    S.events.L=parsedL.events;
    drawLine(svg,parsedL,LAYOUT.lineY2,"L","var(--blue-d)",lv.beats);
  }else S.events.L=[];

  // カーソル
  const yTop = two?LAYOUT.lineY1-58 : LAYOUT.lineY1+8-58;
  const yBot = two?LAYOUT.lineY2+30 : LAYOUT.lineY1+8+30;
  const c=el("line",{x1:-99,y1:yTop,x2:-99,y2:yBot,stroke:"var(--gold)","stroke-width":4,
    "stroke-linecap":"round",opacity:0},svg);
  cursorEls=[c];
}

/* ---------- 判定マーク ---------- */
function markHit(ev,kind){ // kind: good|ok|late
  const svg=document.getElementById("scoreSvg");
  const y=ev.y-60;
  const col = kind==="good"?"var(--green)": kind==="ok"?"var(--gold)":"#C9B8A0";
  if(kind==="good"||kind==="ok"){
    el("circle",{cx:ev.x,cy:y,r:11,fill:"none",stroke:col,"stroke-width":4},svg);
    if(kind==="good") el("circle",{cx:ev.x,cy:y,r:5,fill:"none",stroke:col,"stroke-width":3},svg);
  }else{
    el("text",{x:ev.x,y:y+6,"font-size":20,"text-anchor":"middle",fill:col,"font-weight":900},svg).textContent="…";
  }
}
function highlight(ev,on){
  if(!ev||!ev.node) return;
  ev.node.style.filter = on?"drop-shadow(0 0 5px rgba(240,138,60,.9))":"";
}

/* ---------- 再生・進行 ---------- */
function beatDur(){ return 60/S.tempo; }
function clearTimers(){ S.timers.forEach(t=>clearTimeout(t)); S.timers=[]; cancelAnimationFrame(S.raf); }

function scheduleMetronome(t0){
  const b=beatDur();
  const total=S.beats+(S.measures*S.beats); // カウント1小節＋本編
  for(let i=0;i<total;i++) clickSound(t0+i*b, i%S.beats===0);
}
function scheduleModel(t0){ // 「きいてみる」用：お手本音
  const u=beatDur()/4;
  S.events.R.forEach(ev=>{ if(!ev.rest && !ev.tied) tapR(t0+ev.t16*u, S.sched); });
  S.events.L.forEach(ev=>{ if(!ev.rest && !ev.tied) tapL(t0+ev.t16*u, S.sched); });
}

function resetJudgeState(){
  S.combo=0; S.maxCombo=0; S.hitGood=0; S.hitOk=0; S.strays=0;
  buildScore();
  updateCombo();
}

function begin(listenOnly){
  ensureAudio(); clearTimers();
  if(S.sched){ try{S.sched.disconnect();}catch(e){} }
  S.sched=S.ac.createGain(); S.sched.connect(S.master);
  resetJudgeState();
  const b=beatDur();
  S.unit=b/4;
  S.countDur=S.beats*b;
  S.totalDur=S.measures*S.beats*b;
  S.startAt=S.ac.currentTime+0.15;
  S.phase = listenOnly?"listen":"count";
  scheduleMetronome(S.startAt);
  if(listenOnly) scheduleModel(S.startAt+S.countDur);
  setStartBtn(true);
  msg(listenOnly?"👂 おてほんを きいてみよう":"カウントの あとに たたこう！");
  S.raf=requestAnimationFrame(tick);
  const endMs=(S.countDur+S.totalDur+0.45)*1000+150;
  S.timers.push(setTimeout(finish, endMs));
}

function tick(){
  if(S.phase==="idle") return;
  const now=S.ac.currentTime;
  const t=now-S.startAt;
  const co=document.getElementById("countOverlay");
  if(t<S.countDur){
    co.style.display="flex";
    co.textContent = Math.min(S.beats, Math.floor(t/beatDur())+1);
  }else{
    co.style.display="none";
    if(S.phase==="count") S.phase="play";
    const pt=t-S.countDur;
    const t16=pt/S.unit;
    const x=xForUnit(Math.min(t16,S.measures*S.upm), S.measures, S.upm);
    cursorEls.forEach(c=>{ c.setAttribute("x1",x); c.setAttribute("x2",x); c.setAttribute("opacity",0.9); });
    ["R","L"].forEach(h=>{
      S.events[h].forEach(ev=>{
        highlight(ev, t16>=ev.t16 && t16<ev.t16+ev.dur16);
      });
    });
    if(S.mode==="challenge" && S.phase==="play"){
      ["R","L"].forEach(h=>{
        S.events[h].forEach(ev=>{
          if(!ev.rest && !ev.tied && !ev.hit && !ev.missed && pt > ev.t16*S.unit+0.3){
            ev.missed=true; S.combo=0; updateCombo(); markHit(ev,"late");
          }
        });
      });
    }
  }
  S.raf=requestAnimationFrame(tick);
}

function stopPlay(silent){
  clearTimers(); S.phase="idle";
  document.getElementById("countOverlay").style.display="none";
  cursorEls.forEach(c=>c.setAttribute("opacity",0));
  setStartBtn(false);
  if(!silent) msg("とちゅうで やめたよ。もういちど どうぞ！");
  if(S.sched){ try{S.sched.disconnect();}catch(e){} S.sched=null; } // 予約音を一括停止
}

function finish(){
  const wasListen = S.phase==="listen";
  S.phase="idle"; clearTimers();
  cursorEls.forEach(c=>c.setAttribute("opacity",0));
  setStartBtn(false);
  if(wasListen){ msg("どうだった？ こんどは じぶんで たたいてみよう！"); return; }
  if(S.mode==="practice"){ msg("おつかれさま！ チャレンジモードで ○を もらってみよう"); confetti(12); return; }
  showResult();
}

/* ---------- タップ判定 ---------- */
function handleTap(hand){
  ensureAudio();
  const now=S.ac.currentTime;
  (hand==="R"?tapR:tapL)(now);
  flashPad(hand);
  if(S.phase!=="play" && S.phase!=="count") return; // ①あそぶ：いつでも音は鳴る
  if(S.mode!=="challenge") return;             // れんしゅうは判定なし
  const pt = now - S.startAt - S.countDur + S.latency/1000;
  if(pt < -0.35) return;                       // カウント中でも1拍目の直前なら判定する
  const list=S.events[hand];
  let best=null, bestD=1e9;
  list.forEach(ev=>{
    if(ev.rest||ev.tied||ev.hit) return;
    const d=Math.abs(pt-ev.t16*S.unit);
    if(d<bestD){ bestD=d; best=ev; }
  });
  // 16分が出てくると音符間隔がせまいので、窓は音符間隔の半分まで縮める
  const gapLimit = best ? Math.max(0.09, Math.min(0.28, best.dur16*S.unit*0.6)) : 0.28;
  if(best && bestD<=gapLimit){
    best.hit=true;
    const kind = bestD<=Math.min(0.13,gapLimit*0.55)?"good":"ok";
    if(kind==="good"){ S.hitGood++; } else { S.hitOk++; }
    S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    markHit(best,kind); updateCombo();
  }else{
    S.strays++; S.combo=0; updateCombo();
  }
}

function updateCombo(){
  const b=document.getElementById("comboBadge");
  if(S.mode==="challenge" && S.combo>=2){ b.style.display="block"; b.textContent="🔥 "+S.combo; }
  else b.style.display="none";
}

/* ---------- けっか ---------- */
function totalNotes(){ return [...S.events.R,...S.events.L].filter(e=>!e.rest&&!e.tied).length; }
function showResult(){
  const n=totalNotes();
  const pts=S.hitGood*2+S.hitOk*1;
  const pct=Math.round(pts/(n*2)*100);
  let stars = pct>=90?3 : pct>=70?2 : pct>=45?1 : 0;
  const rs=document.getElementById("resStars");
  rs.innerHTML="";
  for(let i=0;i<3;i++){ const s=document.createElement("span"); s.textContent="★"; if(i>=stars)s.className="off"; rs.appendChild(s); }
  document.getElementById("resTitle").textContent =
    stars===3?"パーフェクト級！": stars===2?"すごい！": stars===1?"クリア！":"おしい！もういちど！";
  document.getElementById("resDetail").textContent =
    `ピッタリ ${S.hitGood}こ ／ いいね ${S.hitOk}こ ／ さいだいコンボ ${S.maxCombo}`;
  let sealMsg="";
  if(!S.lv.custom){
    const key="lv"+S.lv.id;
    S.progress[key]=S.progress[key]||{};
    const prev=S.progress[key]["ex"+S.exIdx]||0;
    if(stars>prev) S.progress[key]["ex"+S.exIdx]=stars;
    if(stars>=1 && !S.progress[key].seal){
      S.progress[key].seal=true;
      sealMsg=`シール ${S.lv.seal} を ゲット！`;
      fanfare(); confetti(40);
    }else if(stars>=1){ confetti(24); }
    saveProg();
  }else if(stars>=1){ confetti(24); }
  document.getElementById("resSeal").textContent=sealMsg;
  document.getElementById("resultOverlay").style.display="flex";
}

/* ---------- パーティクル ---------- */
function confetti(n){
  const cols=["#F08A3C","#4A90D9","#4CAF50","#F5B32F","#E96A8D"];
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.top="-20px";
    d.style.background=cols[i%cols.length];
    d.style.animationDelay=(Math.random()*0.4)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),1900);
  }
}

/* ---------- UI 部品 ---------- */
function msg(s){ document.getElementById("msgOverlay").textContent=s; }
function setStartBtn(playing){
  const b=document.getElementById("btnStart");
  b.textContent = playing?"⏹ やめる":"▶ スタート";
  b.classList.toggle("stop",playing);
  document.getElementById("btnListen").disabled=playing;
  document.getElementById("btnListen").style.opacity=playing?0.5:1;
}
function flashPad(hand){
  const p=document.getElementById(hand==="R"?"padR":"padL");
  p.classList.add("flash"); setTimeout(()=>p.classList.remove("flash"),90);
}
function ripple(pad,x,y){
  const r=document.createElement("div"); r.className="ripple";
  r.style.left=x+"px"; r.style.top=y+"px"; pad.appendChild(r);
  setTimeout(()=>r.remove(),480);
}

/* ---------- 画面遷移 ---------- */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function buildSelect(){
  const box=document.getElementById("stairs"); box.innerHTML="";
  // 🎼 じぶんの きょく（MusicXML）— いちばん上
  const cc=document.createElement("button");
  cc.className="lvCard customCard";
  cc.innerHTML=`
    <span class="num">🎼</span>
    <span class="info">
      <span class="name">じぶんの きょく</span><br>
      <span class="desc">MusicXML（Flat for Education など）の楽譜を読み込んで、そのリズムで練習！（.xml / .musicxml / .mxl）</span>
    </span>
    <span class="seal">＋</span>`;
  cc.addEventListener("click",()=>document.getElementById("xmlInput").click());
  box.appendChild(cc);
  // レベル1〜11を順番に
  LEVELS.forEach(lv=>{
    const p=S.progress["lv"+lv.id]||{};
    const best=Math.max(p.ex0||0,p.ex1||0);
    const card=document.createElement("button");
    card.className="lvCard"+(lv.hands===2?" hands2":"");
    card.innerHTML=`
      <span class="num">${lv.id}</span>
      <span class="info">
        <span class="name">${lv.name}　<span class="stars">${"★".repeat(lv.stars)}</span></span><br>
        <span class="desc">${lv.desc}${lv.hands===2?"（りょうて）":""}</span>
        ${best?`<br><span class="best">ベスト ${"⭐".repeat(best)}</span>`:""}
      </span>
      <span class="seal ${p.seal?"got":""}">${p.seal?lv.seal:"？"}</span>`;
    card.addEventListener("click",()=>openLevel(lv));
    box.appendChild(card);
  });
}

function openLevel(lv){
  S.lv=lv; S.exIdx=0;
  document.getElementById("lvLabel").textContent = lv.custom?("🎼 "+lv.name):`Lv${lv.id} ${lv.name}`;
  const tabs=document.getElementById("exTabs"); tabs.innerHTML="";
  if(!lv.custom){
    lv.ex.forEach((_,i)=>{
      const b=document.createElement("button"); b.className="exTab"+(i===0?" on":"");
      b.textContent="だい"+(i+1)+"もん";
      b.addEventListener("click",()=>{ if(S.phase!=="idle")stopPlay(true); S.exIdx=i;
        tabs.querySelectorAll(".exTab").forEach((t,j)=>t.classList.toggle("on",j===i));
        buildScore(); msg(""); });
      tabs.appendChild(b);
    });
  }
  buildScore();
  if(lv.custom) msg(lv.hands===2?"ひだりては はく、みぎては きょくの リズム！":"きょくの リズムを たたこう！");
  else msg(lv.hands===2?"ひだりては はく、みぎては リズム！":"まずは 👂きいてみる が おすすめ！");
  show("scrPlay");
}

/* ---------- MusicXML よみこみフロー ---------- */
let pendingXML=null;
document.getElementById("xmlInput").addEventListener("change",async e=>{
  const file=e.target.files[0];
  e.target.value="";
  if(!file) return;
  try{
    const text=await readMusicXMLFile(file);
    const data=parseMusicXML(text);
    pendingXML={data, fname:file.name.replace(/\.(xml|musicxml|mxl)$/i,"")};
    if(data.fileTempo){
      S.tempo=Math.max(52,Math.min(144,data.fileTempo));
      document.getElementById("tempoRange").value=S.tempo;
      document.getElementById("tempoVal").textContent=S.tempo;
    }
    const info=[];
    info.push(`${data.beats}/4びょうし・${data.measures}小節`);
    if(data.truncated) info.push("（さいしょの8小節だけ よみこみました）");
    if(data.fileTempo) info.push(`テンポ ♩=${S.tempo}`);
    document.getElementById("handsTitle").textContent="🎼 "+(data.title||pendingXML.fname);
    document.getElementById("handsInfo").textContent=info.join("　");
    document.getElementById("handsOverlay").style.display="flex";
  }catch(err){
    alert("よみこめませんでした：\n"+(err.message||err));
  }
});
function startCustom(hands){
  document.getElementById("handsOverlay").style.display="none";
  if(!pendingXML) return;
  const d=pendingXML.data;
  S.custom={custom:true, id:"X", name:(d.title||pendingXML.fname), hands,
            beats:d.beats, seal:null, ex:[null], data:d};
  openLevel(S.custom);
}
document.getElementById("btnHands1").addEventListener("click",()=>startCustom(1));
document.getElementById("btnHands2").addEventListener("click",()=>startCustom(2));
document.getElementById("handsCancel").addEventListener("click",()=>{
  document.getElementById("handsOverlay").style.display="none"; pendingXML=null;
});

/* ---------- イベント登録 ---------- */
document.getElementById("btnBackTop").addEventListener("click",()=>{
  stopPlay(true); buildSelect(); show("scrSelect");
});
document.getElementById("btnStart").addEventListener("click",()=>{
  if(S.phase==="idle") begin(false); else stopPlay(false);
});
document.getElementById("btnListen").addEventListener("click",()=>{
  if(S.phase==="idle") begin(true);
});
document.getElementById("modePractice").addEventListener("click",()=>setMode("practice"));
document.getElementById("modeChallenge").addEventListener("click",()=>setMode("challenge"));
function setMode(m){
  if(S.phase!=="idle") stopPlay(true);
  S.mode=m;
  document.getElementById("modePractice").classList.toggle("on",m==="practice");
  document.getElementById("modeChallenge").classList.toggle("on",m==="challenge");
  msg(m==="challenge"?"○を あつめて ★3を めざそう！":"じゆうに たたいて だいじょうぶ！");
  updateCombo();
}
document.getElementById("wordToggle").addEventListener("click",e=>{
  S.showWords=!S.showWords;
  e.currentTarget.classList.toggle("on",S.showWords);
  document.querySelectorAll(".wordLbl").forEach(t=>t.style.display=S.showWords?"":"none");
});

/* パッド（マルチタッチ対応） */
[["padR","R"],["padL","L"]].forEach(([id,hand])=>{
  const p=document.getElementById(id);
  p.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const rect=p.getBoundingClientRect();
    ripple(p,e.clientX-rect.left,e.clientY-rect.top);
    handleTap(hand);
  });
});
/* キーボード F/J */
const keysDown={};
window.addEventListener("keydown",e=>{
  if(keysDown[e.code]) return; keysDown[e.code]=true;
  if(e.code==="KeyJ") handleTap("R");
  if(e.code==="KeyF") handleTap("L");
});
window.addEventListener("keyup",e=>{ keysDown[e.code]=false; });

/* けっかカード */
document.getElementById("btnRetry").addEventListener("click",()=>{
  document.getElementById("resultOverlay").style.display="none"; buildScore(); msg("");
});
document.getElementById("btnNextEx").addEventListener("click",()=>{
  document.getElementById("resultOverlay").style.display="none";
  if(S.lv.custom){ buildScore(); msg("もういちど ちょうせん！"); return; }
  if(S.exIdx < S.lv.ex.length-1){
    S.exIdx++;
    document.querySelectorAll(".exTab").forEach((t,j)=>t.classList.toggle("on",j===S.exIdx));
    buildScore(); msg("だい"+(S.exIdx+1)+"もん！");
  }else{
    const next=LEVELS.find(l=>l.id===S.lv.id+1);
    if(next) openLevel(next); else { buildSelect(); show("scrSelect"); }
  }
});
document.getElementById("btnBackSel").addEventListener("click",()=>{
  document.getElementById("resultOverlay").style.display="none";
  buildSelect(); show("scrSelect");
});

/* せってい */
document.getElementById("btnGear").addEventListener("click",()=>document.getElementById("settingsPanel").classList.add("open"));
document.getElementById("btnCloseSet").addEventListener("click",()=>document.getElementById("settingsPanel").classList.remove("open"));
document.getElementById("tempoRange").addEventListener("input",e=>{
  S.tempo=+e.target.value; document.getElementById("tempoVal").textContent=S.tempo;
});
document.getElementById("volRange").addEventListener("input",e=>{
  S.vol=e.target.value/100; document.getElementById("volVal").textContent=e.target.value;
  if(S.master) S.master.gain.setValueAtTime(S.vol,S.ac.currentTime);
});
document.getElementById("latRange").addEventListener("input",e=>{
  S.latency=+e.target.value; document.getElementById("latVal").textContent=S.latency;
});

/* 全画面 */
document.getElementById("btnFull").addEventListener("click",()=>{
  const d=document.documentElement;
  if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
});

/* 初期化（スタート画面なし：初回タッチでAudioContextをresume） */
loadProg();
buildSelect();
document.addEventListener("pointerdown",function once(){ ensureAudio(); },{once:true});
</script>
