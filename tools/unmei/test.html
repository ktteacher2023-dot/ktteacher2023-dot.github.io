<style>
  :root{
    --bg:#F5F7FA;
    --card:#FFFFFF;
    --ink:#243352;
    --sub:#5B6B8C;
    --line:#D8DFEC;
    --accent:#E8542F;   /* だーん・録音 */
    --hi:#FFC838;       /* つぎの音・ハイライト */
    --soft:#EDF1F8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{height:100%;}
  html,body{overflow:hidden;}
  body{
    /* ★モバイル修正①：100% → dvh。
       iOS Safariはアドレスバー分だけ100%が実際の画面より高くなり、
       下のボタン列（きろく・きく）が画面外に隠れて押せなくなる */
    height:100vh;
    height:100dvh;
    background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",sans-serif;
    display:flex;flex-direction:column;
    touch-action:manipulation; /* ダブルタップ拡大でボタン連打が奪われるのを防ぐ */
  }

  /* ---------- ヘッダー ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 18px;flex-wrap:wrap;
    background:var(--card);border-bottom:2px solid var(--line);
    flex-shrink:0;
  }
  .title .main{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(19px,3vw,28px);font-weight:700;letter-spacing:.04em;
  }
  .title .sub{
    font-size:clamp(11px,1.5vw,14px);color:var(--sub);display:block;margin-top:2px;
  }
  .dynMeter{
    background:var(--soft);border:2px solid var(--line);border-radius:14px;
    padding:6px 18px;min-width:130px;text-align:center;
  }
  .dynMeter .label{font-size:11px;color:var(--sub);letter-spacing:.15em;font-weight:600;}
  .dynMeter .value{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1.15;color:var(--ink);
  }

  /* ---------- モチーフ表示 ---------- */
  #motif{
    display:flex;flex-direction:column;gap:8px;align-items:center;
    padding:12px 8px 10px;background:var(--card);
    border-bottom:2px solid var(--line);
    flex-shrink:0;
  }
  .phrase{display:flex;gap:clamp(10px,2.2vw,20px);align-items:center;}
  .note{
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(15px,2.5vw,22px);font-weight:700;letter-spacing:.05em;
    color:var(--sub);background:var(--card);
    border:3px solid var(--line);border-radius:999px;
    width:clamp(52px,9vw,78px);height:clamp(52px,9vw,78px);
    transition:transform .1s, background .15s, color .15s, border-color .15s, box-shadow .15s;
    user-select:none;-webkit-user-select:none;
  }
  .note.long{width:clamp(104px,19vw,180px);}
  .note.next{
    border-color:var(--hi);background:var(--hi);color:var(--ink);
    box-shadow:0 3px 0 #d9a51f;
    animation:breathe 1.5s ease-in-out infinite;
  }
  .note.done{background:var(--soft);color:#A6B1C9;border-color:var(--soft);}
  .note.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
    transform:scale(1.12);box-shadow:0 0 0 6px rgba(232,84,47,.22);
  }
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  /* ---------- タップステージ ---------- */
  #stageWrap{
    position:relative;flex:1;min-height:0;margin:10px 12px;
    /* ★モバイル修正②：ステージの最低高さを保証。
       スマホ縦画面ではヘッダー＋モチーフ＋ボタン列で高さを使い切り、
       タップする場所そのものがほぼ0pxに潰れていた（＝「使えない」の正体） */
    min-height:140px;
    /* ★v2：タップの受け口をcanvasからこの枠全体に変更。
       ブラウザにスクロール操作として奪われないようにする */
    touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stageCard{
    position:absolute;inset:0;border-radius:20px;overflow:hidden;
    background:
      linear-gradient(180deg,
        rgba(232,84,47,.16),
        rgba(255,200,56,.13) 45%,
        rgba(36,51,82,.05));
    border:3px dashed var(--line);
  }
  canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:pointer;
    /* iPad/iPhoneで「だーん」の長押し中に選択・長押しメニューが出て操作が奪われるのを防ぐ */
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .volLabel{
    position:absolute;left:14px;pointer-events:none;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .volLabel .mark{font-size:clamp(22px,3.4vw,32px);font-style:italic;}
  .volLabel .word{font-size:clamp(11px,1.6vw,14px);color:var(--sub);font-family:inherit;}
  .volLabel.top{top:12px;}
  .volLabel.bottom{bottom:12px;}
  #banner{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;border-radius:999px;
    padding:8px 24px;font-size:clamp(13px,1.8vw,15px);font-weight:600;letter-spacing:.06em;
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
    box-shadow:0 3px 10px rgba(36,51,82,.25);
  }
  #banner.show{opacity:1;}

  /* ---------- 下部コントロール ---------- */
  footer{
    display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    padding:10px 12px;background:var(--card);border-top:2px solid var(--line);
    /* ★モバイル修正①関連：iPhoneのホームバーに隠れないよう安全余白 */
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .grp{
    display:flex;gap:8px;align-items:center;
    background:var(--soft);border-radius:16px;padding:6px 10px;
  }
  .grp .glabel{font-size:12px;color:var(--sub);font-weight:700;padding:0 4px;letter-spacing:.08em;}
  footer button{
    font-family:inherit;font-size:clamp(13px,1.8vw,16px);font-weight:700;letter-spacing:.04em;
    border:2px solid var(--ink);border-radius:14px;
    padding:10px 18px;min-height:44px;
    background:var(--card);color:var(--ink);cursor:pointer;
    box-shadow:0 2px 0 var(--line);
    transition:background .15s,color .15s,border-color .15s,transform .05s;
    touch-action:manipulation;
  }
  footer button:active{transform:translateY(1px);box-shadow:none;}
  footer button:disabled{opacity:.35;cursor:default;border-color:var(--line);box-shadow:none;}
  footer button.rec.armed{background:var(--accent);border-color:var(--accent);color:#fff;}
  footer button.play.has{background:var(--hi);border-color:var(--hi);color:var(--ink);}
  @media (prefers-reduced-motion: reduce){ .note.next{animation:none;} }

  /* ★モバイル修正③：スマホ・小型タブレット縦向け コンパクトレイアウト。
     ヘッダー・モチーフ・ボタン列をぎゅっと縮めて、
     ステージ（タップする場所）に高さを返す */
  @media (max-width:640px), (max-height:600px){
    header{padding:6px 10px;gap:8px;}
    .title .main{font-size:16px;}
    .title .sub{font-size:10px;margin-top:1px;}
    .dynMeter{padding:2px 10px;min-width:84px;border-radius:10px;}
    .dynMeter .label{font-size:9px;}
    .dynMeter .value{font-size:20px;}
    #motif{padding:6px 4px 5px;gap:4px;}
    .phrase{gap:8px;}
    .note{width:40px;height:40px;font-size:13px;border-width:2px;}
    .note.long{width:84px;}
    .note.active{box-shadow:0 0 0 4px rgba(232,84,47,.22);}
    #stageWrap{margin:6px 8px;}
    #stageCard{border-radius:14px;border-width:2px;}
    .volLabel{left:10px;gap:5px;}
    .volLabel .mark{font-size:17px;}
    .volLabel .word{font-size:9px;}
    .volLabel.top{top:8px;}
    .volLabel.bottom{bottom:8px;}
    #banner{padding:6px 16px;font-size:11px;top:8px;}
    footer{gap:6px;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom));}
    .grp{padding:4px 6px;gap:5px;border-radius:12px;}
    .grp .glabel{font-size:10px;padding:0 2px;}
    footer button{font-size:12px;padding:8px 12px;min-height:40px;border-radius:10px;}
  }
</style>
</head>

  </div>

<div id="stageWrap">

  <canvas id="stage"></canvas>
  <div class="volLabel top"><span class="mark">f</span><span class="word">上のほう＝つよい音</span></div>

  </div>

  </div>

<script>
(() => {
  /* ============ モチーフ（冒頭のみ） ============ */
  const NOTES = [
    {label:'だ',    midi:[67],         hold:false},
    {label:'だ',    midi:[67],         hold:false},
    {label:'だ',    midi:[67],         hold:false},
    {label:'だーん', midi:[63,55,48],  hold:true},
    {label:'だ',    midi:[65],         hold:false},
    {label:'だ',    midi:[65],         hold:false},
    {label:'だ',    midi:[65],         hold:false},
    {label:'だーん', midi:[62,55,43],  hold:true},
  ];
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ============ モチーフ表示 ============ */
  const motifEl = document.getElementById('motif');
  const noteEls = [];
  [[0,4],[4,8]].forEach(([a,b]) => {
    const row = document.createElement('div');
    row.className = 'phrase';
    for (let i = a; i < b; i++){
      const d = document.createElement('div');
      d.className = 'note' + (NOTES[i].hold ? ' long' : '');
      d.textContent = NOTES[i].label;
      row.appendChild(d);
      noteEls.push(d);
    }
    motifEl.appendChild(row);
  });

  function updateMotif(){
    noteEls.forEach((el, i) => {
      el.classList.toggle('done', i < idx && i !== holdIdx);
      el.classList.toggle('next', i === idx);
      if (i !== holdIdx) el.classList.remove('active');
    });
  }
  function flashNote(i, on){
    if (!noteEls[i]) return;
    noteEls[i].classList.toggle('active', on);
    if (on) noteEls[i].classList.remove('next');
  }

  /* ============ オーディオ ============ */
  let ctx = null, master = null, filter = null;

  /* ★モバイル修正④：iPhone/iPadの「サイレントスイッチ（マナーモード）」対策。
     Web Audioの音はマナーモード中は鳴らない端末があり、
     これが「iPadで音が出ない＝使えない」報告の最有力原因。
     対策は2段構え：
     (1) navigator.audioSession.type='playback'（iOS 17前後〜の正式な方法）
     (2) 無音の<audio>を1回再生して、音の経路を「メディア再生」に切り替える（従来の定番技） */
  let silentEl = null, routeUnlocked = false;
  function unlockMediaRoute(){
    if (routeUnlocked) return;
    try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch(_){}
    if (!silentEl){
      silentEl = document.createElement('audio');
      silentEl.setAttribute('playsinline','');
      silentEl.loop = false;
      silentEl.src = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
    }
    const p = silentEl.play();
    if (p && p.catch) p.catch(()=>{});
    routeUnlocked = true;
  }

  function initAudio(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.ratio.value = 3;  // 強弱の差を潰さないよう軽めに
    filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 2400; filter.Q.value = 0.6;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(filter).connect(comp).connect(ctx.destination);
  }

  /* ★v3の核心：音の装置の「起こし待ち」に制限時間を付ける。
     iPadでは ctx.resume() の完了通知が永遠に来ないことがあり（iOS Safariの既知の癖）、
     旧コードはそれを待ち続けて以降のタップが全滅していた。
     0.6秒待って返事がなければ、鳴っても鳴らなくても先へ進む。
     装置は次のタップで再度起こしにいくので、詰まりが残らない */
  function resumeWithTimeout(ms){
    return new Promise(res => {
      let done = false;
      const finish = () => { if (!done){ done = true; res(); } };
      try { ctx.resume().then(finish, finish); } catch(_) { finish(); }
      setTimeout(finish, ms);
    });
  }

  /* 強弱→音量・音色の変換（②きづく：pp と ff の差が耳ではっきりわかるように）
     人の耳は音量を対数で感じるため、指数カーブで約20dBの幅をつける */
  const ampOf = d => 0.028 * Math.pow(15, d);            // pp≈0.03 → ff≈0.36
  const filterHz = d => 420 + Math.pow(d, 1.5) * 6200;   // よわい=こもった音、つよい=明るい音

  function playShort(midis, dyn, t){
    filter.frequency.setTargetAtTime(filterHz(dyn), t, 0.05);
    midis.forEach(m => {
      [-5, 5].forEach(dt => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = midiHz(m); o.detune.value = dt;
        o.connect(g).connect(master);
        const peak = ampOf(dyn) * (m < 55 ? 1.3 : 1);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + (0.034 - dyn * 0.026));
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
        o.start(t); o.stop(t + 0.3);
      });
    });
  }

  function playHold(midis, dyn, t){
    filter.frequency.setTargetAtTime(filterHz(dyn), t, 0.05);
    const parts = [];
    midis.forEach(m => {
      [-6, 6].forEach(dt => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = midiHz(m); o.detune.value = dt;
        o.connect(g).connect(master);
        o.start(t);
        parts.push({o, g, m});
      });
    });
    const peakOf = (m, v) => ampOf(v) * 0.92 * (m < 55 ? 1.3 : 1);
    parts.forEach(({g, m}) => {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peakOf(m, dyn), t + 0.03);
    });
    return {
      setDyn(v, rt){
        parts.forEach(({g, m}) => g.gain.setTargetAtTime(peakOf(m, v), rt, 0.09));
        filter.frequency.setTargetAtTime(filterHz(v), rt, 0.12);
      },
      release(rt){
        parts.forEach(({o, g}) => {
          g.gain.cancelScheduledValues(rt);
          g.gain.setTargetAtTime(0.0001, rt, 0.12);
          o.stop(rt + 0.8);
        });
      }
    };
  }

  /* ============ 演奏の状態 ============ */
  let idx = 0;
  let holdVoice = null, holdIdx = -1;
  let recSlot = null, recEvents = [], recStart = 0;
  const takes = {A: null, B: null};
  let playbackTimers = [], isPlayback = false;
  let lastEnvSample = 0;

  const banner = document.getElementById('banner');
  const dynValue = document.getElementById('dynValue');
  const dynMark = v => v<0.12?'pp':v<0.28?'p':v<0.45?'mp':v<0.62?'mf':v<0.82?'f':'ff';

  function showDyn(v){
    const mark = dynMark(v);
    dynValue.textContent = mark;
    dynValue.style.fontSize = Math.round(18 + v * 20) + 'px';  // pp=小さく ff=大きく
    dynValue.style.color = (mark === 'f' || mark === 'ff') ? 'var(--accent)' : 'var(--ink)';
  }
  function showBanner(msg, ms){
    banner.textContent = msg;
    banner.classList.add('show');
    if (ms) setTimeout(() => banner.classList.remove('show'), ms);
  }
  function resetSeq(){
    if (holdVoice && ctx){ holdVoice.release(ctx.currentTime); holdVoice = null; }
    idx = 0; holdIdx = -1;
    updateMotif();
  }

  /* ============ タップ入力 ============ */
  const stage = document.getElementById('stage');
  const g2d = stage.getContext('2d');
  let W = 0, H = 0;

  /* --- 光の粒（パーティクル）--- */
  let particles = [];
  let holdPoint = null;   // 「だーん」中の指の位置と強さ
  let flash = 0;          // タップした瞬間、画面全体がふわっと光る

  function spawnBurst(x, y, dyn){
    const n = Math.round(5 + Math.pow(dyn, 1.6) * 55);
    for (let i = 0; i < n; i++){
      const ang = Math.random() * Math.PI * 2;
      const sp = (1.5 + Math.random() * 4) * (0.35 + dyn * 2.3);
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - dyn * 1.2,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        size: (2 + Math.random() * 4) * (0.45 + dyn * 1.5),
        hue: 38 - dyn * 22 + Math.random() * 8,   // よわい=黄 → つよい=赤
        note: Math.random() < 0.18                 // ときどき音符が飛ぶ
      });
    }
    flash = Math.min(0.55, 0.015 + dyn * dyn * 0.6);
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    stage.width = Math.max(1, W * dpr); stage.height = Math.max(1, H * dpr);
    g2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  /* ★モバイル修正⑤：サイズ変更の検知を強化。
     スマホは回転・アドレスバーの出入り・キーボードでステージの大きさが頻繁に変わる。
     従来のresizeイベントだけでは取りこぼし、canvasの座標と実際の指の位置がずれていた */
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stageWrap'));
  window.addEventListener('load', resize);
  window.addEventListener('pageshow', resize);

  /* H=0（レイアウト未確定）のときは中間の強さで返す安全弁 */
  const dynFromY = y => {
    if (H <= 0){ resize(); }
    return H > 0 ? Math.min(1, Math.max(0.05, 1 - y / H)) : 0.5;
  };
  /* ★v2の核心：入力方式の二本立て。
     旧コードは Pointer Events（pointerdown等）だけに頼っていたが、
     この方式に対応していないタブレット（古いiPad等）では
     イベントが一切発生せず「タッチしても無反応」になる。
     Pointer Events が使える端末はそれを、使えない端末は
     昔ながらの Touch Events（touchstart等）を使う。 */

  let activeId = null;          // いま演奏中の指のID（pointerId / touch identifier / 'mouse'）
  let downInProgress = false;   // タッチ開始処理（AudioContext起動待ち）の途中か
  let upWhileDown = false;      // その待ち中に指が離れた（速いタップ対策）
  let lastDownAt = 0;           // ★v3：詰まり検知用（最後にタッチが始まった時刻）

  /* ★v3：どんな状態からでも無条件で初期状態に戻す安全装置 */
  function forceRelease(){
    downInProgress = false; upWhileDown = false;
    if (holdIdx !== -1){
      if (holdVoice && ctx){ try { holdVoice.release(ctx.currentTime); } catch(_){} }
      holdVoice = null; holdPoint = null;
      flashNote(holdIdx, false); holdIdx = -1;
    }
    activeId = null;
  }

  // 座標はcanvasの矩形から計算する（offsetX/Yはタッチ環境で不安定なことがある）
  const posFromXY = (clientX, clientY) => {
    const r = stage.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  };

  async function handleDown(clientX, clientY, id){
    if (isPlayback) return;
    if (activeId !== null){
      // ★v3：前のタッチが何かの理由で解放されないまま残っていたら、4秒で強制復帰。
      //   これで「一度詰まると二度と反応しない」が起こらなくなる
      if (performance.now() - lastDownAt > 4000) forceRelease();
      else return;
    }
    lastDownAt = performance.now();
    activeId = id;
    downInProgress = true;
    upWhileDown = false;

    const { x: ox, y: oy } = posFromXY(clientX, clientY);
    const dyn = dynFromY(oy);

    /* 「目に見える反応」を音の準備より先に出す */
    showDyn(dyn);
    spawnBurst(ox, oy, dyn);

    unlockMediaRoute();
    try {
      if (!ctx) initAudio();
      // 装置が眠っていたら起こす。ただし0.6秒以上は待たない（★v3）
      if (ctx.state !== 'running') await resumeWithTimeout(600);
    } catch(err){
      // 音が作れなくても演奏の進行（見た目）は続ける
      var b = document.getElementById('errBox');
      if (b){ b.style.display='block'; b.textContent = '⚠ 音の準備に失敗: ' + err.message; }
    }
    downInProgress = false;

    // ★v4：音の装置のいまの状態を右下に表示（診断用）
    var vb = document.getElementById('verBadge');
    if (vb) vb.textContent = 'v4 ・ おと: ' + (ctx ? ctx.state : 'なし');

    const note = NOTES[idx];

    if (recSlot && idx === 0){ recStart = performance.now(); recEvents = []; }
    const ev = recSlot ? {dt: (performance.now() - recStart) / 1000, i: idx, dyn} : null;
    if (ev) recEvents.push(ev);

    if (note.hold){
      if (ctx) holdVoice = playHold(note.midi, dyn, ctx.currentTime);
      holdIdx = idx;
      flashNote(idx, true);
      holdPoint = {x: ox, y: oy, dyn};
      if (ev){ ev.pressAt = performance.now(); ev.env = []; }
    } else {
      if (ctx) playShort(note.midi, dyn, ctx.currentTime);
      const i = idx;
      flashNote(i, true);
      setTimeout(() => flashNote(i, false), 180);
    }

    idx++;
    if (!note.hold){
      if (idx >= NOTES.length) finishPass();
      else updateMotif();
    }

    // 起動待ちの間にすでに指が離れていた場合の後始末
    if (upWhileDown){
      upWhileDown = false;
      if (note.hold){
        // 「だーん」を短くでも鳴らしてから閉じる（無反応より音が出るほうが体験として正しい）
        setTimeout(() => { if (holdIdx !== -1) releaseHold(); }, 120);
      } else {
        activeId = null;  // 指はもう離れているので自分で解放する
      }
    }
  }

  // 押したまま上下 → 鳴っている「だーん」の強弱をリアルタイムに変える
  function handleMove(clientX, clientY, id){
    if (id !== activeId || holdIdx === -1) return;
    const p = posFromXY(clientX, clientY);
    const dyn = dynFromY(p.y);
    if (holdVoice && ctx) holdVoice.setDyn(dyn, ctx.currentTime);
    showDyn(dyn);

    holdPoint = {x: p.x, y: p.y, dyn};
    const now = performance.now();
    if (now - lastEnvSample > 60){
      if (recSlot){
        const ev = recEvents[recEvents.length - 1];
        if (ev && ev.pressAt) ev.env.push({dt: (now - ev.pressAt) / 1000, dyn});
      }
      lastEnvSample = now;
    }
  }

  // 「だーん」を閉じる共通処理
  function releaseHold(){
    activeId = null;
    if (holdVoice && ctx) holdVoice.release(ctx.currentTime);
    holdVoice = null;
    if (holdPoint) spawnBurst(holdPoint.x, holdPoint.y, holdPoint.dyn * 0.7);
    holdPoint = null;
    flashNote(holdIdx, false);
    if (recSlot){
      const ev = recEvents[recEvents.length - 1];
      if (ev && ev.pressAt) ev.holdDur = (performance.now() - ev.pressAt) / 1000;
    }
    holdIdx = -1;
    if (idx >= NOTES.length) finishPass();
    else updateMotif();
  }

  function handleUp(id){
    if (id !== activeId) return;
    if (downInProgress){ upWhileDown = true; return; }  // 起動待ち中：本処理側に後始末を任せる
    if (holdIdx !== -1) releaseHold();
    else activeId = null;
  }

  function handleCancel(id){
    if (id !== activeId) return;
    if (downInProgress){ upWhileDown = true; return; }
    activeId = null;
    if (holdIdx !== -1){
      if (holdVoice && ctx) holdVoice.release(ctx.currentTime);
      holdVoice = null; holdPoint = null;
      flashNote(holdIdx, false); holdIdx = -1;
    }
  }

  /* --- イベント登録：受け口はcanvasではなく枠全体（stageWrap） --- */
  const inputTarget = document.getElementById('stageWrap');

  if (window.PointerEvent){
    // 新しい端末：Pointer Events
    inputTarget.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { inputTarget.setPointerCapture(e.pointerId); } catch(_) {}
      handleDown(e.clientX, e.clientY, e.pointerId);
    });
    inputTarget.addEventListener('pointermove', e => handleMove(e.clientX, e.clientY, e.pointerId));
    inputTarget.addEventListener('pointerup', e => handleUp(e.pointerId));
    inputTarget.addEventListener('pointercancel', e => handleCancel(e.pointerId));
  } else {
    // 古いiPad等：Touch Events（preventDefaultでスクロールに奪われないようにする）
    inputTarget.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      if (t) handleDown(t.clientX, t.clientY, t.identifier);
    }, {passive:false});
    inputTarget.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++){
        const t = e.changedTouches[i];
        handleMove(t.clientX, t.clientY, t.identifier);
      }
    }, {passive:false});
    inputTarget.addEventListener('touchend', e => {
      for (let i = 0; i < e.changedTouches.length; i++) handleUp(e.changedTouches[i].identifier);
    });
    inputTarget.addEventListener('touchcancel', e => {
      for (let i = 0; i < e.changedTouches.length; i++) handleCancel(e.changedTouches[i].identifier);
    });
    // マウスしかない古いPC向けの保険
    inputTarget.addEventListener('mousedown', e => handleDown(e.clientX, e.clientY, 'mouse'));
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY, 'mouse'));
    window.addEventListener('mouseup', () => handleUp('mouse'));
  }

  function finishPass(){
    if (recSlot){
      takes[recSlot] = recEvents.slice();
      const btn = document.getElementById('play' + recSlot);
      btn.disabled = false;
      btn.classList.add('has');
      document.getElementById('rec' + recSlot).classList.remove('armed');
      showBanner(`✓ 演奏${recSlot}にきろくしました！`, 2200);
      recSlot = null;
    } else {
      showBanner('✨ すばらしい演奏！', 1600);
    }
    setTimeout(resetSeq, 300);
  }

  /* ============ 再生（聴き比べ・クレッシェンドも再現） ============ */
  function playback(slot){
    const take = takes[slot];
    if (!take || isPlayback) return;
    unlockMediaRoute();
    if (!ctx) initAudio();
    ctx.resume();
    isPlayback = true;
    resetSeq();
    showBanner(`▶ 演奏${slot} をさいせい中…`);
    const t0 = ctx.currentTime + 0.25;
    let endMs = 0;

    take.forEach(ev => {
      const note = NOTES[ev.i];
      const t = t0 + ev.dt;
      if (note.hold){
        const dur = Math.max(0.3, ev.holdDur || 0.8);
        const v = playHold(note.midi, ev.dyn, t);
        (ev.env || []).forEach(s => {
          playbackTimers.push(setTimeout(
            () => v.setDyn(s.dyn, ctx.currentTime),
            (ev.dt + s.dt) * 1000 + 250));
        });
        playbackTimers.push(setTimeout(() => v.release(ctx.currentTime), (ev.dt + dur) * 1000 + 250));
        endMs = Math.max(endMs, (ev.dt + dur) * 1000);
      } else {
        playShort(note.midi, ev.dyn, t);
        endMs = Math.max(endMs, ev.dt * 1000 + 300);
      }
      playbackTimers.push(setTimeout(() => {
        flashNote(ev.i, true);
        const off = note.hold ? Math.max(300, (ev.holdDur || 0.8) * 1000) : 180;
        playbackTimers.push(setTimeout(() => flashNote(ev.i, false), off));
        showDyn(ev.dyn);
      }, (ev.dt + 0.25) * 1000));
    });

    playbackTimers.push(setTimeout(() => {
      isPlayback = false;
      banner.classList.remove('show');
      resetSeq();
    }, endMs + 900));
  }

  /* ============ 描画 ============ */
  function draw(){
    g2d.clearRect(0, 0, W, H);

    // タップの瞬間、画面全体がふわっと光る（強いほど明るく）
    if (flash > 0.005){
      g2d.fillStyle = `rgba(255,200,56,${(flash * 0.5).toFixed(3)})`;
      g2d.fillRect(0, 0, W, H);
      flash *= 0.88;
    }

    // 「だーん」のオーラ：指のまわりで光が脈打つ。強弱でオーラが育つ
    if (holdVoice && holdPoint){
      const d = holdPoint.dyn;
      const base = 24 + d * 220;
      const pulse = base * (1 + Math.sin(performance.now() / 110) * 0.06);
      const grad = g2d.createRadialGradient(
        holdPoint.x, holdPoint.y, 5, holdPoint.x, holdPoint.y, pulse);
      grad.addColorStop(0, `rgba(232,84,47,${(0.16 + d * 0.44).toFixed(3)})`);
      grad.addColorStop(0.6, `rgba(255,200,56,${(0.08 + d * 0.28).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(255,200,56,0)');
      g2d.fillStyle = grad;
      g2d.beginPath();
      g2d.arc(holdPoint.x, holdPoint.y, pulse, 0, Math.PI * 2);
      g2d.fill();
      // 鳴っている間、光の粒がわきつづける
      if (Math.random() < 0.45 + d * 0.5){
        const ang = Math.random() * Math.PI * 2;
        particles.push({
          x: holdPoint.x + Math.cos(ang) * base * 0.4,
          y: holdPoint.y + Math.sin(ang) * base * 0.4,
          vx: Math.cos(ang) * 0.6,
          vy: -0.8 - d * 1.5,
          life: 1, decay: 0.012 + Math.random() * 0.015,
          size: (2 + Math.random() * 3) * (0.7 + d),
          hue: 30 - d * 15 + Math.random() * 10,
          note: Math.random() < 0.15
        });
      }
    }

    // 光の粒
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.035;  // ふわりと落ちる
      p.life -= p.decay;
      if (p.life <= 0){ particles.splice(i, 1); continue; }
      const a = Math.max(0, p.life);
      if (p.note){
        g2d.fillStyle = `hsla(${p.hue},85%,45%,${a.toFixed(3)})`;
        g2d.font = `${Math.round(10 + p.size * 2.4)}px serif`;
        g2d.fillText('♪', p.x, p.y);
      } else {
        g2d.fillStyle = `hsla(${p.hue},90%,52%,${a.toFixed(3)})`;
        g2d.beginPath();
        g2d.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
        g2d.fill();
      }
    }
    if (particles.length > 400) particles.splice(0, particles.length - 400);
    requestAnimationFrame(draw);
  }

  /* ============ ボタン ============ */
  function armRec(slot){
    if (isPlayback) return;
    resetSeq();
    recSlot = (recSlot === slot) ? null : slot;
    document.getElementById('recA').classList.toggle('armed', recSlot === 'A');
    document.getElementById('recB').classList.toggle('armed', recSlot === 'B');
    if (recSlot) showBanner(`● 演奏${recSlot} をきろく中 ― さいしょからどうぞ`);
    else banner.classList.remove('show');
  }
  document.getElementById('recA').addEventListener('click', () => armRec('A'));
  document.getElementById('recB').addEventListener('click', () => armRec('B'));
  document.getElementById('playA').addEventListener('click', () => playback('A'));
  document.getElementById('playB').addEventListener('click', () => playback('B'));
  document.getElementById('resetBtn').addEventListener('click', () => {
    playbackTimers.forEach(clearTimeout); playbackTimers = [];
    isPlayback = false;
    banner.classList.remove('show');
    resetSeq();
  });

  updateMotif();
  resize();
  requestAnimationFrame(draw);

  /* ★v3：iPadで通知・アプリ切替・ロックの後に音の装置が止まったままになる対策。
     画面に戻ってきたら自動で起こし直す */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ctx && ctx.state !== 'running'){
      try { ctx.resume().catch(()=>{}); } catch(_){}
    }
  });
})();
</script>
</body>
</html>
