<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>まねっこどうぶつ｜けいてぃの音楽ツールズ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#9B5DE5;--ink:#2B2B33;--paper:#F7F2FF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Zen Maru Gothic',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  user-select:none;touch-action:manipulation}
header{padding:18px 20px 4px;text-align:center}
h1{font-size:clamp(24px,5vw,34px);font-weight:900;color:var(--main);letter-spacing:.06em}
.sub{font-size:13px;font-weight:700;color:#8f84a3;margin-top:2px}

#stage{margin-top:12px;background:#fff;border-radius:24px;box-shadow:0 4px 0 rgba(0,0,0,.06);
  width:min(92vw,520px);padding:20px;text-align:center}
#animal{font-size:clamp(70px,16vw,110px);line-height:1.2;display:inline-block;transition:transform .2s}
#animal.sing{animation:sing .4s ease-in-out infinite alternate}
#animal.happy{animation:happy .5s ease-in-out 3}
@keyframes sing{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
@keyframes happy{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px) rotate(-8deg)}}
#noteRow{display:flex;gap:10px;justify-content:center;margin-top:10px;min-height:56px;align-items:flex-end}
.noteBall{width:44px;border-radius:12px;background:#E9DCFF;color:var(--main);
  font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:background .15s, color .15s}
.noteBall.lit{background:var(--main);color:#fff}
.noteBall.good{background:#7BE0AD;color:#fff}
#msg{margin-top:12px;font-weight:900;font-size:clamp(15px,3.6vw,19px);color:var(--main);min-height:2em}
#recBar{height:10px;border-radius:999px;background:#EDE4FA;margin-top:8px;overflow:hidden;display:none}
#recFill{height:100%;width:0%;background:#FF6B6B;border-radius:999px}

#controls{display:flex;gap:10px;margin:16px 0 8px;flex-wrap:wrap;justify-content:center}
.ctl{font-family:inherit;font-weight:900;font-size:15px;padding:12px 20px;border-radius:999px;
  border:3px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink)}
.ctl.accent{background:var(--main);border-color:var(--main);color:#fff}
.ctl:disabled{opacity:.4;cursor:default}
#levelRow{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.lv{font-family:inherit;font-weight:900;font-size:13.5px;padding:9px 16px;border-radius:999px;
  border:3px solid #d9c8f5;background:#fff;cursor:pointer;color:#8f84a3}
.lv.on{border-color:var(--main);color:var(--main)}
</style>
</head>
<body>
<header>
  <h1>まねっこどうぶつ</h1>
  <div class="sub">どうぶつの うたを きいて、おなじように うたってみよう!</div>
</header>

<div id="stage">
  <div id="animal">🐱</div>
  <div id="noteRow"></div>
  <div id="msg">🎤 マイクを おしたら はじまるよ</div>
  <div id="recBar"><div id="recFill"></div></div>
</div>

<div id="controls">
  <button class="ctl accent" id="micBtn">🎤 マイクをつかう</button>
  <button class="ctl" id="playBtn" disabled>🔊 きく</button>
  <button class="ctl" id="singBtn" disabled>🎵 うたう</button>
  <button class="ctl" id="nextBtn" disabled>つぎ ▶</button>
</div>
<div id="levelRow">
  <button class="lv on" data-lv="0">レベル1 ふたつのおと</button>
  <button class="lv" data-lv="1">レベル2 みっつのおと</button>
  <button class="lv" data-lv="2">レベル3 よっつのおと</button>
</div>

<script>
(() => {
  // note frequencies (4th octave), child-range so-mi world
  const NF = {'ド':261.63,'レ':293.66,'ミ':329.63,'ソ':392.00,'ラ':440.00};
  const LEVELS = [
    // level 1: 2 notes
    [['ソ','ミ'],['ミ','ソ'],['ソ','ラ'],['ラ','ソ']],
    // level 2: 3 notes
    [['ソ','ミ','ソ'],['ソ','ラ','ソ'],['ミ','ソ','ラ'],['ラ','ソ','ミ']],
    // level 3: 4 notes
    [['ソ','ラ','ソ','ミ'],['ミ','ソ','ラ','ソ'],['ソ','ミ','ソ','ラ'],['ド','レ','ミ','ソ']],
  ];
  const animals = ['🐱','🐶','🐰','🐼','🐸','🦁'];
  let level = 0, phrase = [], animalIdx = 0;
  let audio = null, analyser = null, buf = null, sampleRate = 44100;

  const $ = id => document.getElementById(id);
  const animal = $('animal'), msg = $('msg'), noteRow = $('noteRow');

  // ---- audio out ----
  function ensureAudio(){
    if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state === 'suspended') audio.resume();
  }
  function playNote(f, t, dur){
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.28, t + .04);
    g.gain.setValueAtTime(.28, t + dur - .08);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  function fanfare(){
    const t = audio.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
      const o=audio.createOscillator(),g=audio.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.13,t+i*.08);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.35);
      o.connect(g).connect(audio.destination);
      o.start(t+i*.08);o.stop(t+i*.08+.4);
    });
  }

  // ---- mic ----
  $('micBtn').addEventListener('click', async () => {
    ensureAudio();
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      sampleRate = audio.sampleRate;
      const src = audio.createMediaStreamSource(stream);
      analyser = audio.createAnalyser();
      analyser.fftSize = 2048;
      src.connect(analyser);
      buf = new Float32Array(analyser.fftSize);
      $('micBtn').disabled = true; $('micBtn').textContent = '🎤 オン';
      $('playBtn').disabled = false; $('nextBtn').disabled = false;
      newPhrase();
    }catch(e){ msg.textContent = 'マイクが つかえないみたい。せんせいに きいてね。'; }
  });

  function detectPitch(){
    analyser.getFloatTimeDomainData(buf);
    let rms = 0;
    for(let i=0;i<buf.length;i++) rms += buf[i]*buf[i];
    rms = Math.sqrt(rms/buf.length);
    if(rms < 0.025) return -1;
    const minF=110, maxF=800;
    const minLag=Math.floor(sampleRate/maxF), maxLag=Math.floor(sampleRate/minF);
    let bestLag=-1, bestCorr=0;
    for(let lag=minLag; lag<=maxLag; lag++){
      let c=0;
      for(let i=0;i<buf.length-lag;i++) c += buf[i]*buf[i+lag];
      if(c>bestCorr){bestCorr=c;bestLag=lag;}
    }
    return bestLag>0 ? sampleRate/bestLag : -1;
  }
  const toSemi = f => 12 * Math.log2(f / 261.63); // semitones above C4

  // ---- phrase ----
  function newPhrase(){
    const pool = LEVELS[level];
    phrase = pool[Math.floor(Math.random()*pool.length)];
    animalIdx = (animalIdx+1) % animals.length;
    animal.textContent = animals[animalIdx];
    animal.className = '';
    noteRow.innerHTML = '';
    phrase.forEach(n => {
      const d = document.createElement('div');
      d.className = 'noteBall';
      d.textContent = n;
      // height encodes pitch (visual "feel first")
      const h = 30 + (toSemi(NF[n]) / 12) * 40;
      d.style.height = h + 'px';
      noteRow.appendChild(d);
    });
    msg.textContent = '「🔊きく」で ' + animal.textContent + ' の うたを きいてね';
    $('singBtn').disabled = true;
  }
  $('nextBtn').addEventListener('click', newPhrase);

  document.querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.lv').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    level = +b.dataset.lv;
    if(analyser) newPhrase();
  }));

  // ---- play phrase ----
  const DUR = .65;
  $('playBtn').addEventListener('click', () => {
    ensureAudio();
    const t0 = audio.currentTime + .25;
    const balls = noteRow.children;
    animal.classList.add('sing');
    phrase.forEach((n,i) => {
      playNote(NF[n], t0 + i*DUR, DUR*.9);
      setTimeout(() => {
        [...balls].forEach(b=>b.classList.remove('lit'));
        balls[i].classList.add('lit');
      }, ((t0 + i*DUR) - audio.currentTime)*1000);
    });
    setTimeout(() => {
      [...balls].forEach(b=>b.classList.remove('lit'));
      animal.classList.remove('sing');
      $('singBtn').disabled = false;
      msg.textContent = 'こんどは きみのばん! 「🎵うたう」を おしてね';
    }, (phrase.length*DUR + .5)*1000);
  });

  // ---- record & judge ----
  let recording = false;
  $('singBtn').addEventListener('click', () => {
    if(recording) return;
    recording = true;
    $('singBtn').disabled = true;
    const recLen = phrase.length * DUR * 1000 + 900;
    msg.textContent = 'うたって! 🎤';
    $('recBar').style.display = 'block';
    const t0 = performance.now();
    const samples = [];
    (function poll(){
      const el = performance.now() - t0;
      $('recFill').style.width = Math.min(el/recLen*100,100) + '%';
      const f = detectPitch();
      if(f > 0) samples.push({t:el, semi:toSemi(f)});
      if(el < recLen) requestAnimationFrame(poll);
      else finish(samples);
    })();
  });

  function finish(samples){
    recording = false;
    $('recBar').style.display = 'none';
    $('recFill').style.width = '0%';
    if(samples.length < 8){
      msg.textContent = 'こえが きこえなかったみたい。もういちど 🎵';
      $('singBtn').disabled = false;
      return;
    }
    // segment into notes: group consecutive samples, median per segment
    const segs = [];
    let cur = [samples[0]];
    for(let i=1;i<samples.length;i++){
      const gap = samples[i].t - samples[i-1].t;
      const jump = Math.abs(samples[i].semi - samples[i-1].semi);
      if(gap > 180 || jump > 1.8){ segs.push(cur); cur = []; }
      cur.push(samples[i]);
    }
    segs.push(cur);
    const notes = segs.filter(s => s.length >= 4).map(s => {
      const vals = s.map(x=>x.semi).sort((a,b)=>a-b);
      return vals[Math.floor(vals.length/2)];
    });
    judge(notes);
  }

  function judge(sung){
    const target = phrase.map(n => toSemi(NF[n]));
    const balls = noteRow.children;
    // contour compare (octave-agnostic: fold sung to nearest octave of first target)
    if(sung.length === 0){
      msg.textContent = 'こえが きこえなかったみたい。もういちど 🎵';
      $('singBtn').disabled = false; return;
    }
    // fold octave
    const offset = Math.round((sung[0] - target[0]) / 12) * 12;
    const folded = sung.map(s => s - offset);

    // contour of target vs sung
    const contour = a => a.slice(1).map((v,i)=> v - a[i] > .8 ? 1 : (a[i] - v > .8 ? -1 : 0));
    const tc = contour(target);
    // if note counts differ, compare compressed contour
    const sc = contour(folded);
    let contourOK;
    if(sung.length === target.length){
      contourOK = tc.every((v,i)=> v === sc[i]);
      // pitch accuracy bonus
      let hit = 0;
      target.forEach((t,i)=>{ if(Math.abs(folded[i]-t) < 1.2) hit++; });
      if(contourOK && hit === target.length){
        [...balls].forEach(b=>b.classList.add('good'));
        animal.classList.add('happy'); fanfare();
        msg.textContent = 'かんぺき! ' + animal.textContent + ' が よろこんでる 🎉';
        return;
      }
      if(contourOK){
        [...balls].forEach(b=>b.classList.add('good'));
        animal.classList.add('happy'); fanfare();
        msg.textContent = 'せいかい! かたちが ぴったり 🎊';
        return;
      }
    } else {
      // compress repeats and compare shape loosely
      contourOK = JSON.stringify(tc.filter(v=>v!==0)) === JSON.stringify(sc.filter(v=>v!==0));
      if(contourOK){
        animal.classList.add('happy'); fanfare();
        msg.textContent = 'いいね! うたの かたちは あってるよ 🎵';
        return;
      }
    }
    msg.textContent = 'おしい! もういちど 🔊きいてから うたってみよう';
    $('singBtn').disabled = false;
  }
})();
</script>
</body>
</html>
